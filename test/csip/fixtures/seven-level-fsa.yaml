# IEEE-057 fixture — 7-level FSA priority chain for CORE-010.
#
# One EndDevice; seven FunctionSetAssignments hung off it, each
# pointing at a DERProgramList that contains exactly one DERProgram.
# DERProgram primacy values ascend 0..6 (lower primacy = higher
# priority per spec §10.2; L0 is the system-level top).
#
# Priority chain (utility-down-to-inverter granularity; level names
# chosen by IEEE-057 since CSIP V1.2 does not mandate a vocabulary —
# Noor's V1.2 matrix Section 4 makes no fixed naming claim):
#
#   primacy 0  L0-system          System operator / RTO top of stack.
#   primacy 1  L1-substation      Substation-level program.
#   primacy 2  L2-feeder          Feeder section program.
#   primacy 3  L3-transformer     Service transformer.
#   primacy 4  L4-service-point   Service Point per CSIP §3.2.
#   primacy 5  L5-meter           Revenue meter.
#   primacy 6  L6-device          Closest-to-inverter device program.
#
# CORE-010 procedure: client follows /dcap -> /edev -> /edev/0/fsa
# (this list, all=7) -> each FSA -> DERProgramList -> single
# DERProgram. The 7 FSAs are emitted in ID order (FSA store sorts
# its keys), so test code asserting "L0 first" can rely on the
# ID-as-zero-padded-int convention used below.

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    registration_link: "/edev/0/rg"
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 7

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "L0-SYSTEM-FSA"
    description: "L0-system"
    der_program_list_link:
