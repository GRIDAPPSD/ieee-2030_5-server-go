# CORE-010 fixture: one FunctionSetAssignments whose DERProgramList holds
# all seven groups of the CSIP V1.2 Figure 1 hierarchy.
#
# CORE-010 Setup steps 4 to 7 construct one DERProgram per group, one
# DERProgramList with all of them, and one FunctionSetAssignments that
# links that list. CSIP IG v2 5.2.3 is the same shape: one FSA points to the
# DERProgramList holding every topology-based DERProgram. The seven-FSA
# topology of BASIC-002 and BASIC-003 is seven-level-fsa.yaml.
#
#   primacy 0  L0-system
#   primacy 1  L1-substation
#   primacy 2  L2-feeder
#   primacy 3  L3-transformer
#   primacy 4  L4-service-point
#   primacy 5  L5-meter
#   primacy 6  L6-device

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    registration_link: "/edev/0/rg"
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "CORE-010-TOPOLOGY-FSA"
    description: "CORE-010 topology groups"
    der_program_list_link:
