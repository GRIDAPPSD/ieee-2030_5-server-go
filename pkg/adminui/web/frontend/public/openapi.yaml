openapi: 3.1.0
info:
  title: IEEE 2030.5 Server Admin API
  version: 0.1.0
  description: |
    OpenAPI draft generated from server implementation.

    Route source note:
    - `internal/adminplane/admin_routes.go` does not exist in this repository.
    - Routes were derived from `internal/adminplane/admin_router.go` (authoritative in current tree).

    Modeling policy:
    - Behavior is documented only where it is explicit in handlers/middleware.
    - Unknown or dynamic contracts are marked as unresolved.
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
  - mtls: []
  - ticketQuery: []
tags:
  - name: auth
  - name: certs
  - name: devices
  - name: fsa
  - name: der
  - name: derms
  - name: logs
  - name: content
  - name: panels
  - name: traffic
paths:
  /login:
    get:
      tags: [auth]
      summary: Render login page
      description: HTML login form.
      security: []
      responses:
        '200':
          description: Login page HTML
          content:
            text/html:
              schema:
                type: string

  /auth/login:
    post:
      tags: [auth]
      summary: Submit admin key for browser session
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                key:
                  type: string
              required: [key]
      responses:
        '303':
          description: Login accepted; redirects to '/'
        '200':
          description: Invalid submission re-renders login form
          content:
            text/html:
              schema:
                type: string
        '503':
          description: Browser login unavailable
        '500':
          description: Session issuance failed

  /auth/ticket:
    post:
      tags: [auth]
      summary: Exchange existing admin auth for short-lived ticket
      description: |
        Requires authenticated request and non-ticket admission path.
        Refused when current admission itself is by query ticket.
      requestBody:
        required: false
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                required: [ticket]
        '401':
          $ref: '#/components/responses/AuthRequired'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/certs/ca:
    get:
      tags: [certs]
      summary: Download serving CA certificate
      description: Sensitive route; real credential required.
      responses:
        '200':
          description: CA certificate PEM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertResponse'
        '503':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/certs/server:
    post:
      tags: [certs]
      summary: Mint server certificate
      description: Sensitive route; real credential required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerCertRequest'
      responses:
        '201':
          description: Server cert and private key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertResponse'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '503':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/certs/device:
    post:
      tags: [certs]
      summary: Mint device certificate
      description: Sensitive route; real credential required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceCertRequest'
      responses:
        '201':
          description: Device cert, private key, SFDI/LFDI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceCertResponse'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '503':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/certs/device-types:
    get:
      tags: [certs]
      summary: List supported cert device type vocabulary
      description: Sensitive route; real credential required.
      responses:
        '200':
          description: Device type catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceTypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceTypeInfo'
                required: [deviceTypes]

  /api/certs/info:
    post:
      tags: [certs]
      summary: Parse uploaded PEM certificate metadata
      description: Sensitive route; real credential required.
      requestBody:
        required: true
        content:
          application/x-pem-file:
            schema:
              type: string
              description: PEM certificate bytes
          multipart/form-data:
            schema:
              type: object
              properties:
                cert:
                  type: string
              required: [cert]
      responses:
        '200':
          description: Parsed certificate identity material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertInfoResponse'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'

  /api/devices/by-lfdi/{lfdi}:
    get:
      tags: [devices]
      summary: Lookup end device by LFDI
      parameters:
        - in: path
          name: lfdi
          required: true
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{40}$'
      responses:
        '200':
          description: Lookup result; found=false if missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLookupResponse'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/devices:
    post:
      tags: [devices]
      summary: Create EndDevice + Registration (+ optional profile)
      description: The only authed write route exempt from real-credential enforcement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceRequest'
      responses:
        '201':
          description: Device created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDeviceResponse'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '409':
          $ref: '#/components/responses/ErrorJson'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '503':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/device-profiles:
    get:
      tags: [devices]
      summary: List device profiles
      responses:
        '200':
          description: Profile list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceProfileListResponse'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/device-profiles/{lfdi}:
    put:
      tags: [devices]
      summary: Upsert one device profile
      parameters:
        - in: path
          name: lfdi
          required: true
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{40}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceProfileBody'
      responses:
        '200':
          description: Stored profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceProfile'
        '400':
          $ref: '#/components/responses/ErrorJson'
        '409':
          $ref: '#/components/responses/ErrorJson'
        '415':
          $ref: '#/components/responses/UnsupportedContentType'
        '500':
          $ref: '#/components/responses/ErrorJson'

  /api/content/{family}/{id}:
    post:
      tags: [content]
      summary: Create operator content resource
      parameters: &contentParams
        - in: path
          name: family
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema: { type: string }
          application/xml:
            schema: { type: string }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentResult' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '413': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    put:
      tags: [content]
      summary: Replace operator content resource
      parameters: *contentParams
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema: { type: string }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentResult' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '413': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [content]
      summary: Delete operator content resource
      parameters: *contentParams
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/fsas:
    get:
      tags: [fsa]
      summary: List admin FSAs
      responses:
        '200':
          description: FSA list
          content:
            application/json:
              schema:
                type: object
                properties:
                  fsas:
                    type: array
                    items:
                      $ref: '#/components/schemas/FSAResponse'
                required: [fsas]
    post:
      tags: [fsa]
      summary: Create admin FSA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FSACreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSAResponse'
        '400': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/fsas/{id}:
    get:
      tags: [fsa]
      summary: Get one admin FSA
      parameters:
        - &fsaIdParam
          in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: FSA details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FSAResponse'
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [fsa]
      summary: Delete admin FSA
      parameters: *fsaIdParam
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/fsas/{id}/programs:
    post:
      tags: [fsa]
      summary: Attach DERProgram href to FSA
      parameters:
        - *fsaIdParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                programHref: { type: string }
              required: [programHref]
      responses:
        '201': { description: Attached }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [fsa]
      summary: Detach DERProgram href from FSA
      parameters:
        - *fsaIdParam
        - in: query
          name: href
          required: true
          schema: { type: string }
      responses:
        '204': { description: Detached }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/fsas/{id}/der-programs:
    get:
      tags: [fsa]
      summary: List FSA program templates
      parameters:
        - *fsaIdParam
      responses:
        '200':
          description: Templates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgramTemplateView'
                required: [templates]
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    post:
      tags: [fsa]
      summary: Create FSA program template
      parameters: *fsaIdParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramTemplateBody'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramTemplateView'
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/fsas/{id}/der-programs/{derpId}:
    put:
      tags: [fsa]
      summary: Update FSA program template
      parameters:
        - *fsaIdParam
        - in: path
          name: derpId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramTemplateBody' }
      responses:
        '200':
          description: Updated template view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramTemplateView' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [fsa]
      summary: Delete FSA program template
      parameters:
        - *fsaIdParam
        - in: path
          name: derpId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/devices/{id}/fsa-assignment:
    post:
      tags: [fsa]
      summary: Assign device to FSA
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fsaHref: { type: string }
              required: [fsaHref]
      responses:
        '200': { description: Assigned }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [fsa]
      summary: Unassign device from FSA
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: fsaHref
          required: true
          schema: { type: string }
      responses:
        '204': { description: Unassigned }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/devices/{id}/fsas/{fsaId}/der-programs:
    post:
      tags: [fsa]
      summary: Create device program under device FSA
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: fsaId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramTemplateBody' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceProgramView' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/devices/{id}/der-programs/{derpId}:
    put:
      tags: [fsa]
      summary: Update device program
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: derpId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramTemplateBody' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceProgramView' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [fsa]
      summary: Delete device program
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: derpId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/topology:
    get:
      tags: [fsa]
      summary: Get topology tree
      responses:
        '200':
          description: Topology root
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyNode' }

  /api/der-programs:
    get:
      tags: [der]
      summary: List all DER programs on server
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
        - in: query
          name: start
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Program page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramListReply' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/management-pairs:
    get:
      tags: [devices]
      summary: Query management pair mappings
      parameters:
        - in: query
          name: manager
          schema: { type: string }
        - in: query
          name: managed
          schema: { type: string }
      responses:
        '200':
          description: Query-specific JSON shape
          content:
            application/json:
              schema:
                description: |
                  Response shape depends on query mode (`manager` or `managed`).
                  Contract is explicit in `internal/handler/admin_management.go`.
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    post:
      tags: [devices]
      summary: Create management pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagementPairRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementPairCreated' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }
    delete:
      tags: [devices]
      summary: Remove management pair by managed LFDI
      parameters:
        - in: query
          name: managed
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/management-pairs/rekey:
    post:
      tags: [devices]
      summary: Rekey management pair side
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagementRekeyRequest' }
      responses:
        '200':
          description: Rekeyed
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '409': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /api/device-logs/{lfdi}:
    get:
      tags: [logs]
      summary: Read device log page
      parameters:
        - in: path
          name: lfdi
          required: true
          schema: { type: string, pattern: '^[A-Fa-f0-9]{40}$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - in: query
          name: before
          schema: { type: string }
        - in: query
          name: after
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, description: comma-list }
        - in: query
          name: scope
          schema:
            type: string
            enum: [own, managed]
      responses:
        '200':
          description: Log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLogResponse' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '503': { $ref: '#/components/responses/ErrorJson' }

  /api/device-logs/{lfdi}/download:
    get:
      tags: [logs]
      summary: Download raw NDJSON log for device
      parameters:
        - in: path
          name: lfdi
          required: true
