# #60 fixture — 7 DERPrograms hung off 7 FSAs for CORE-013.
#
# CSIP V1.2 §6.6 — DER Program advanced. One EndDevice; seven
# FunctionSetAssignments, each pointing at a DERProgramList carrying
# exactly one DERProgram. DERProgram primacy values ascend 0..6
# (lower primacy = higher priority per spec §10.2).
#
# CORE-013 procedure metadata (asserted by the test, not by the
# loader — DefaultDERControl carries no DateTimeInterval field by
# spec, and DERControl PUT is not wired into the server today, so
# the test seeds DefaultDERControls programmatically with the
# opModFixedPFInjectW values and proves the per-program scope
# stays intact under the priority chain):
#
#   primacy | start-time offset | duration | mode
#   --------|-------------------|----------|-----------------------
#   0       | T+0  min          | 30 s     | opModFixedPFInjectW
#   1       | T+1  min          | 30 s     | opModFixedPFInjectW
#   2       | T+2  min          | 30 s     | opModFixedPFInjectW
#   3       | T+3  min          | 30 s     | opModFixedPFInjectW
#   4       | T+4  min          | 30 s     | opModFixedPFInjectW
#   5       | T+5  min          | 30 s     | opModFixedPFInjectW
#   6       | T+6  min          | 30 s     | opModFixedPFInjectW
#
# Why no default_der_controls in the YAML: the #52 loader's
# DERControlBaseSpec covers opModConnect/Energize/FixedW/MaxLimW/
# TargetW/VoltVar/FreqDroop only — opModFixedPFInjectW (FixedPowerFactor
# shape) is not in the schema today. Per the #60 ticket Pike does
# not touch csiptest internals, so the test seeds DefaultDERControls
# via the public store API in-test, then asserts wire fidelity via the
# server's GET handler.

