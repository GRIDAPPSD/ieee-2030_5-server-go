name: "Supply the IEEE 2030.5 WADL"
description: >
  Reassemble a licensed sep_wadl.xml from a repository secret into a file
  outside the checkout and export SEP2_WADL_PATH plus SEP2_WADL_REQUIRED, so the
  WADL-gated conformance tests RUN instead of skipping. Optionally does the same
  for sep.xsd (SEP2_SCHEMA_PATH plus SEP2_SCHEMA_REQUIRED), from two secret
  parts, through the same reassemble.sh.

  Factored out of ci.yml so the digest constants and the reassembly logic have
  exactly one home. Two copies would drift the moment the secret is resealed,
  and a stale copy fails open: the gated tests skip and the run still reports
  green, which is the failure this whole gate exists to prevent.

inputs:
  wadl-xz-b64:
    description: >
      Base64-encoded xz stream holding sep_wadl.xml. Pass
      secrets.SEP2_WADL_XZ_B64; a composite action cannot read the secrets
      context itself.
    required: false
    default: ""
  required:
    description: >
      "true" makes an absent secret a HARD FAILURE rather than a skip. Set it on
      every trigger that always runs in the base-repository context (schedule,
      workflow_dispatch, push), because there absence means a deleted, empty, or
      half-rotated secret, not legitimate withholding. Leave it "false" only
      where GitHub genuinely withholds secrets, which today is exactly one case:
      a pull request from a fork.
    required: false
    default: "false"

  schema-xz-b64-0:
    description: >
      First half of the base64-encoded xz stream holding sep.xsd. Pass
      secrets.SEP2_SCHEMA_XZ_B64_0, the name core-go uses. Both halves empty
      leaves the schema gate unarmed; exactly one empty fails.
    required: false
    default: ""
  schema-xz-b64-1:
    description: >
      Second half of that stream. Pass secrets.SEP2_SCHEMA_XZ_B64_1.
    required: false
    default: ""

outputs:
  schema-armed:
    description: >
      "true" when a digest-verified sep.xsd is on disk and SEP2_SCHEMA_REQUIRED
      has been exported.
    value: ${{ steps.schema.outputs.armed }}
  armed:
    description: >
      "true" when a digest-verified WADL is on disk and SEP2_WADL_REQUIRED has
      been exported. Callers gate their TestWADLGateArmed assertion on this.
    value: ${{ steps.supply.outputs.armed }}

runs:
  using: composite
  steps:
    - id: supply
      shell: bash
      # Nothing below echoes the secret or the decoded file, and printf is a
      # shell builtin, so no part of the document reaches a process argument
      # list either. The values are bound to env: rather than interpolated into
      # the script body, so a value carrying shell metacharacters is never
      # expanded before execution.
      env:
        WADL_XZ_B64: ${{ inputs.wadl-xz-b64 }}
        WADL_REQUIRED: ${{ inputs.required }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Transport check on the reassembly only: these describe the bytes
        # sealed into the secret (IEEE 2030.5-2018 Model Build 20180301
        # sep_wadl.xml). The document's identity is pinned independently and
        # more strongly by the Go loader, over a normalized sha256 (see
        # test/conformance/wadl/wadl.go). If the secret is ever resealed from a
        # copy with different line endings, update these two values; the Go-side
        # digest is unaffected.
        want_md5=949b3f54ddf3252c4500807c77009bc9
        want_bytes=220733

        case "$WADL_REQUIRED" in
          true|false) ;;
          *)
            echo "::error::The supply-wadl action's 'required' input must be exactly \"true\" or \"false\", got \"$WADL_REQUIRED\". Refusing to guess: guessing false here is how a gate goes dark."
            exit 1
            ;;
        esac

        if [ -z "${WADL_XZ_B64:-}" ]; then
          if [ "$WADL_REQUIRED" = "true" ]; then
            echo "::error::No WADL secret in scope, but this run requires one. SEP2_WADL_XZ_B64 is empty or unset. This trigger always runs in the base-repository context, so GitHub is not withholding the secret: it is missing, empty, or half-rotated. Failing instead of skipping, because a skip here means the conformance sweep measures nothing while reporting green."
            exit 1
          fi
          echo "No WADL secret in scope for this run (fork pull request, or secret withheld)."
          echo "Leaving SEP2_WADL_REQUIRED unset: the WADL-gated tests SKIP and the run stays green."
          echo "armed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        REASSEMBLE_PAYLOAD=$WADL_XZ_B64 bash "$ACTION_PATH/reassemble.sh" \
          "WADL" sep2-wadl sep_wadl.xml "$want_md5" "$want_bytes" SEP2_WADL_PATH

        # Only reached once the file on disk is verified, so no path gets to
        # go test with a WADL configured but unchecked, and none gets there with
        # the secret present but REQUIRED unset.
        echo "SEP2_WADL_REQUIRED=1" >> "$GITHUB_ENV"
        echo "armed=true" >> "$GITHUB_OUTPUT"

    - id: schema
      shell: bash
      # Same handling as the WADL step; the schema arrives in two secret parts
      # because it exceeds one secret's size limit.
      env:
        SCHEMA_PART_0: ${{ inputs.schema-xz-b64-0 }}
        SCHEMA_PART_1: ${{ inputs.schema-xz-b64-1 }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Transport check on the reassembly only: the bytes sealed into the two
        # secrets (IEEE 2030.5-2018 Model Build 20180301 sep.xsd), matching the
        # values core-go checks. The Go loader pins the document's identity.
        want_md5=e4acb8b31a64a70c06af24f22f2d0441
        want_bytes=381926

        # Both parts empty is legitimate absence (a fork pull request, or the
        # secrets not yet added). Exactly one empty is a broken pair.
        if [ -z "${SCHEMA_PART_0:-}" ] && [ -z "${SCHEMA_PART_1:-}" ]; then
          echo "No schema secrets in scope for this run (fork pull request, secrets withheld, or not yet added)."
          echo "Leaving SEP2_SCHEMA_REQUIRED unset: the schema-gated sweep checks SKIP and the run stays green."
          echo "armed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "${SCHEMA_PART_0:-}" ] || [ -z "${SCHEMA_PART_1:-}" ]; then
          echo "::error::Exactly one of SEP2_SCHEMA_XZ_B64_0 and SEP2_SCHEMA_XZ_B64_1 is set. That is a broken secret pair, not an absent schema; set both or neither."
          exit 1
        fi

        REASSEMBLE_PAYLOAD="${SCHEMA_PART_0}${SCHEMA_PART_1}" bash "$ACTION_PATH/reassemble.sh" \
          "schema" sep2-schema sep.xsd "$want_md5" "$want_bytes" SEP2_SCHEMA_PATH

        echo "SEP2_SCHEMA_REQUIRED=1" >> "$GITHUB_ENV"
        echo "armed=true" >> "$GITHUB_OUTPUT"
