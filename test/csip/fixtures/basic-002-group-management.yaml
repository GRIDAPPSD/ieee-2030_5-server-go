# IEEE-082 fixture — BASIC-002 Group Management (CSIP V1.2 §8.2).
#
# Same 7-level FSA topology as CORE-010's seven-level-fsa.yaml, plus
# a DefaultDERControl and a single active DERControl seeded at the
# L6-device level (closest-to-inverter). BASIC-002 asserts:
#
#   - The 7-level FSA priority chain advertises correctly (primacy
#     0..6 in store-key order, per CORE-010 assertions).
#   - The closest-to-inverter program (L6, primacy 6 in this chain;
#     "highest specificity" per CSIP §8.2 procedure — see test
#     doc-comment for the wording-vs-implementation rationale) carries
#     a DefaultDERControl with opModMaxLimW (a 4 kW limit) AND a single
#     active DERControl with opModFixedW (target operating point) so
#     the procedure's "highest-specificity program carries actual
#     control" leg is wire-asserted.
#   - The other six levels (L0..L5) carry no controls — the fixture
#     deliberately ships zero DERControls + zero DefaultDERControls on
#     L0..L5 so the procedure's "only the closest-level program
#     drives the device" assertion has a contrasting baseline.
#
# Priority chain (identical to CORE-010 for cross-reference):
#
#   primacy 0  L0-system          System operator / RTO top of stack.
#   primacy 1  L1-substation      Substation-level program.
#   primacy 2  L2-feeder          Feeder section program.
#   primacy 3  L3-transformer     Service transformer.
#   primacy 4  L4-service-point   Service Point per CSIP §3.2.
#   primacy 5  L5-meter           Revenue meter.
#   primacy 6  L6-device          Closest-to-inverter device program
#                                 (carries DDERC + active DERControl).
#
# Note on store scoping: the in-memory DERProgram store keys by
# EndDevice id only (router.go scopedListHandler). FSA position is
# decorative in today's server — every FSA's DERProgramListLink
# returns all 7 programs. The DefaultDERControl + DERControl, however,
# are keyed under the composite "{edev}/{fsa}/{derp}" scope, so they
# render only when walked via the L6 path (/edev/0/fsa/6/derp/6/...).
# BASIC-002 asserts that scoping directly.

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    registration_link: "/edev/0/rg"
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 7

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "L0-SYSTEM-FSA"
    description: "L0-system"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1
  - end_device_id: "0"
    id: "1"
    mrid: "L1-SUBSTATION-FSA"
    description: "L1-substation"
    der_program_list_link:
      href: "/edev/0/fsa/1/derp"
      all: 1
  - end_device_id: "0"
    id: "2"
    mrid: "L2-FEEDER-FSA"
    description: "L2-feeder"
    der_program_list_link:
      href: "/edev/0/fsa/2/derp"
      all: 1
  - end_device_id: "0"
    id: "3"
    mrid: "L3-TRANSFORMER-FSA"
    description: "L3-transformer"
    der_program_list_link:
      href: "/edev/0/fsa/3/derp"
      all: 1
  - end_device_id: "0"
    id: "4"
    mrid: "L4-SERVICE-POINT-FSA"
    description: "L4-service-point"
    der_program_list_link:
      href: "/edev/0/fsa/4/derp"
      all: 1
  - end_device_id: "0"
    id: "5"
    mrid: "L5-METER-FSA"
    description: "L5-meter"
    der_program_list_link:
      href: "/edev/0/fsa/5/derp"
      all: 1
  - end_device_id: "0"
    id: "6"
    mrid: "L6-DEVICE-FSA"
    description: "L6-device"
    der_program_list_link:
      href: "/edev/0/fsa/6/derp"
      all: 1

der_programs:
  - end_device_id: "0"
    fsa_id: "0"
    id: "0"
    mrid: "L0-SYSTEM-DERP"
    description: "L0-system"
    primacy: 0
    default_der_control_link: "/edev/0/fsa/0/derp/0/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/0/derp/0/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "1"
    id: "1"
    mrid: "L1-SUBSTATION-DERP"
    description: "L1-substation"
    primacy: 1
    default_der_control_link: "/edev/0/fsa/1/derp/1/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/1/derp/1/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "2"
    id: "2"
    mrid: "L2-FEEDER-DERP"
    description: "L2-feeder"
    primacy: 2
    default_der_control_link: "/edev/0/fsa/2/derp/2/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/2/derp/2/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "3"
    id: "3"
    mrid: "L3-TRANSFORMER-DERP"
    description: "L3-transformer"
    primacy: 3
    default_der_control_link: "/edev/0/fsa/3/derp/3/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/3/derp/3/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "4"
    id: "4"
    mrid: "L4-SERVICE-POINT-DERP"
    description: "L4-service-point"
    primacy: 4
    default_der_control_link: "/edev/0/fsa/4/derp/4/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/4/derp/4/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "5"
    id: "5"
    mrid: "L5-METER-DERP"
    description: "L5-meter"
    primacy: 5
    default_der_control_link: "/edev/0/fsa/5/derp/5/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/5/derp/5/derc"
      all: 0
  - end_device_id: "0"
    fsa_id: "6"
    id: "6"
    mrid: "L6-DEVICE-DERP"
    description: "L6-device"
    primacy: 6
    default_der_control_link: "/edev/0/fsa/6/derp/6/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/6/derp/6/derc"
      all: 1

# Only the L6 (closest-to-inverter) DERProgram carries a DefaultDERControl.
# Limit = 4 kW (multiplier 0, value 4000). The other six levels (L0..L5)
# advertise their default_der_control_link but the server returns 404
# when walked — by design, the procedure asserts both shapes.
default_der_controls:
  - end_device_id: "0"
    fsa_id: "6"
    der_program_id: "6"
    mrid: "BASIC-002-L6-DDERC"
    der_control_base:
      op_mod_max_lim_w:
        multiplier: 0
        value: 4000

# One active DERControl on L6 (target operating point = 3 kW). Asserts
# the closest-to-inverter program's active event is the one the
# inverter follows after priority resolution. Other levels carry no
# DERControl events.
der_controls:
  - end_device_id: "0"
    fsa_id: "6"
    der_program_id: "6"
    id: "0"
    mrid: "BASIC-002-L6-DERC"
    der_control_base:
      op_mod_fixed_w:
        multiplier: 0
        value: 3000
