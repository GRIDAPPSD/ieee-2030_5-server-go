# #143 / BASIC-020 fixture — CSIP V1.2 §8.20.
#
# Topology: 2 DERPrograms (SP primacy=0, SY primacy=1), each with one
# DefaultDERControl and one DERControl. The two DERControls occupy
# non-overlapping intervals AND target the same opMod* (opModFixedW).
# §8.20 is the most procedural-heavy non-overlap case: client must
# resolve "highest-primacy program wins" outside event windows and
# transition into each event during its window.
#
# Intervals:
#   SP DERC "a": [1700000060, 1700000120)  — t0+60s..t0+120s
#   SY DERC "a": [1700000180, 1700000240)  — t0+180s..t0+240s
#
# Server-side test asserts both programs render with the expected
# primacy + DDERC + DERControl payloads. The disjoint-windows
# property is asserted across the FLAT list of all DERControls (one
# per program), proving the fixture is internally consistent.

