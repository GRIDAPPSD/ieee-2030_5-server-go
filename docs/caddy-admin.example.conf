# Example Caddyfile for fronting the IEEE 2030.5 admin listener.
#
# Pair with: SEP2_ADMIN_LISTEN=127.0.0.1:9443 SEP2_ADMIN_TLS=false
# Caddy terminates TLS (Let's Encrypt) and reverse-proxies to the plain-HTTP
# admin port. Bind the admin port to localhost so the unencrypted socket is
# never reachable off-box.

admin.example.com {
    reverse_proxy 127.0.0.1:9443
}
