# below are chosen so the priority chain is store-key-ordered (0=SY,
# 1=FDx, 2=SPxx, 3=DEV per inverter).
fsas:
  # EDFI (aggregator) — single FSA for its own management.
  - end_device_id: "0"
    id: "0"
    mrid: "EDFI-SELF-FSA"
    description: "EDFI-management"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1

  # EDA1 — SY → FDA → SPA1 → DEV
