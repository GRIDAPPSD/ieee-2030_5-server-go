# Runner-tag discipline: all jobs run on the forge runner pool.
# Runners visible to arista/ieee-2030_5/ have run_untagged: false,
# so every job MUST carry tags: [forge] to be claimed.

stages: [verify]

verify:
  stage: verify
  image: golang:1.26
  tags: [forge]
  script:
    - go vet ./...
    - go build ./...
    - go test ./...
    - go test -race ./...
