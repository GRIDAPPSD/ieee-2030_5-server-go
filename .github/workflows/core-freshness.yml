name: "Core freshness"

# Two independent watchdogs against github.com/GRIDAPPSD/ieee-2030_5-core-go,
# the private wire-format module this server depends on. Neither gates
# a pull_request: core moves on its own schedule, independent of what a
# given server PR touches, so failing an unrelated PR because core
# advanced would be noise, not signal. Both run on a daily schedule
# plus workflow_dispatch instead.
#
# Background (2026-08-02): this repo pins core-go v0.6.0, and core's
# origin/main is 38 commits ahead of that tag as of this workflow's
# introduction. That means this server's CSIP conformance suite (the
# thing the project otherwise relies on as a conformance gate) has
# never compiled against several weeks of core work, including
# wire-format changes to served bytes that no compile check catches.
# The sibling gridappsd-ieee-2030_5-go bridge hit the identical defect
# three times in one day before this workflow was written.
#
# staleness-check answers "is our pin behind core main, and by what
# commits" cheaply (no test run), keeps failing red on drift so the
# signal stays visible in the checks list, AND opens or updates a
# single reusable pull request (branch chore/bump-core) carrying the
# evidence: pinned version, target, commit count, and the intervening
# commit subjects. The failing check and the PR are deliberately both
# kept: the check is the signal that shows up without anyone opening a
# PR list, the PR is the actionable artifact with a diff and a
# reviewer assignment surface. conformance-vs-core-main answers the
# more important question: "does the CSIP suite still pass against
# core main," by invoking the repo's own existing CSIP targets
# (test-csip, test-csip-server) rather than duplicating any test
# infrastructure: see test/csip/README.md and the `csip` job in ci.yml
# for what these targets already cover.
#
# conformance-vs-core-main also supplies the licensed IEEE WADL and sets
# SEP2_WADL_REQUIRED, so `make test` drives the WADL conformance sweep in
# test/conformance/wadl against core main rather than skipping it. Before
# this arming was added, the gated tests skipped, `go test` exited 0, and
# this job reported green every single run while measuring nothing. A
# scheduled job that cannot fail is worse than no job, because it occupies
# the slot where a real signal would go and everyone downstream reasons as
# though core main is being watched.
#
# The bump PR is expected to open RED while core is ahead of what this
# server has been verified against: that is the point, converting
# invisible drift into a red PR someone has to look at. The fix for a
# red bump PR belongs in this server (or, if core made an unintentional
# breaking change, in core), never by reverting the bump.
#
# The INFRA FAILURE annotations are staleness-check-only by design: only
# that job has an expected-red state (real drift), so only there is an
# untitled failure ambiguous.
#
# GitHub-hosted runners are appropriate: staleness-check reads (clone,
# rev-list) plus one force-push to a bot branch and a PR API call,
# never anything a human owns; conformance-vs-core-main never commits
# or pushes what it builds. See .claude/rules/devops.md "GitHub
# Actions" for the posture this follows.

on:
  schedule:
    # Daily, 07:00 UTC.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staleness-check:
    name: Core pin staleness check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint read-only GitHub App installation token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-core-go
          permission-contents: read

      - name: Annotate infra failure (read-token mint)
        # failure() is load-bearing: with no status-check function in a
        # step `if:`, GitHub applies an implicit success(), which would
        # skip this step in exactly the case it exists for.
        if: failure() && steps.read-token.outcome == 'failure'
        run: |
          echo "::error title=INFRA FAILURE (staleness-check)::Failed to mint the read-only GitHub App installation token for github.com/GRIDAPPSD/ieee-2030_5-core-go. See the mint step's log above for the underlying error."

      - name: Mint write-scoped GitHub App installation token
        # Separate token, separate purpose: pushing the chore/bump-core
        # branch and opening/updating its PR on THIS repo only. Scoped
        # to exactly this repo, never to core, so a leaked token cannot
        # write to the dependency. Kept as two tokens rather than one
        # broader one because create-github-app-token applies a single
        # permission set across every repo listed in `repositories:`;
        # folding read (on core) and write (on this repo) into one
        # mint would grant write on core too.
        id: write-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-server-go
          permission-contents: write
          permission-pull-requests: write

      - name: Annotate infra failure (write-token mint)
        if: failure() && steps.write-token.outcome == 'failure'
        run: |
          echo "::error title=INFRA FAILURE (staleness-check)::Failed to mint the write-scoped GitHub App installation token for this repository. See the mint step's log above for the underlying error."

      - name: Configure private module access
        # Without this, `go list -m` below cannot reach the private core
        # module and dies on "could not read Username for
        # https://github.com" before the staleness comparison runs.
        # Duplicated from the conformance job rather than shared: each job
        # mints a differently-scoped token under a different step id, so a
        # composite action would need a token input just to plumb the
        # value through. Uses this job's existing read-only token.
        env:
          APP_TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compare pinned core version against core main
        # To switch the comparison target from core's origin/main to
        # its latest release tag once Kit's plain vX.Y.Z tags are
        # flowing: change only the TARGET_SHA/TARGET_LABEL resolution
        # below (e.g. `git -C /tmp/core-freshness-check describe --tags
        # --abbrev=0` on a ref-match limited to vX.Y.Z, then rev-parse
        # that tag), and drop the `origin/main` label in the PR/error
        # text for the tag name. Nothing downstream (the bump branch,
        # the PR body, the exit-on-drift step) needs to change: they
        # all consume TARGET_SHA/TARGET_LABEL/BEHIND/COMMITS as
        # already-resolved values, not "main" directly.
        id: compare
        env:
          APP_TOKEN: ${{ steps.read-token.outputs.token }}
        run: |
          set -euo pipefail

          if ! git clone --quiet \
            "https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/ieee-2030_5-core-go.git" \
            /tmp/core-freshness-check; then
            echo "::error title=INFRA FAILURE (staleness-check)::Failed to clone github.com/GRIDAPPSD/ieee-2030_5-core-go. See the log above for the underlying git error."
            exit 1
          fi
          TARGET_SHA=$(git -C /tmp/core-freshness-check rev-parse origin/main)
          TARGET_LABEL="core main ($TARGET_SHA)"
          echo "core origin/main: $TARGET_SHA"

          if ! PIN_VERSION=$(go list -m -f '{{.Version}}' github.com/GRIDAPPSD/ieee-2030_5-core-go); then
            echo "::error title=INFRA FAILURE (staleness-check)::Failed to resolve the pinned github.com/GRIDAPPSD/ieee-2030_5-core-go module version via go list -m. See the log above for the underlying go error."
            exit 1
          fi
          echo "Pinned version: $PIN_VERSION"

          # A Go pseudo-version ends in a 14-digit timestamp and a
          # 12-hex-digit abbreviated commit hash; pull the hash straight
          # out of the version string. A plain semver tag has no such
          # suffix and is resolved to a commit via the tag ref in the
          # clone instead.
          if echo "$PIN_VERSION" | grep -qE -- '[0-9]{14}-[0-9a-f]{12}$'; then
            PIN_SHA=$(echo "$PIN_VERSION" | grep -oE '[0-9a-f]{12}$')
          else
            PIN_SHA=$(git -C /tmp/core-freshness-check rev-list -n1 "refs/tags/${PIN_VERSION}")
          fi
          echo "Pinned commit: $PIN_SHA"

          if ! BEHIND=$(git -C /tmp/core-freshness-check rev-list --count "${PIN_SHA}..${TARGET_SHA}"); then
            echo "::error title=INFRA FAILURE (staleness-check)::Failed to count commits between the pinned commit and ${TARGET_LABEL} via git rev-list. See the log above for the underlying git error."
            exit 1
          fi
          echo "Commits behind target: $BEHIND"

          {
            echo "commits<<COMMITS_EOF"
            git -C /tmp/core-freshness-check log --oneline "${PIN_SHA}..${TARGET_SHA}"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "pin_version=$PIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_label=$TARGET_LABEL" >> "$GITHUB_OUTPUT"

      - name: Bump core pin on chore/bump-core (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          # Passed via env: rather than interpolated directly into the
          # commit message text below, so a value with shell
          # metacharacters is never expanded before execution. See
          # .claude/rules/secure-coding.md "trust the boundary, not the
          # caller"; the same pattern release.yml already uses for
          # VERSION.
          APP_TOKEN: ${{ steps.read-token.outputs.token }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
        run: |
          set -euo pipefail
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git config --global user.name "gridappsd-ieee-20305-ci[bot]"
          git config --global user.email "gridappsd-ieee-20305-ci[bot]@users.noreply.github.com"

          git checkout -B chore/bump-core
          go get github.com/GRIDAPPSD/ieee-2030_5-core-go@main
          go mod tidy
          git add go.mod go.sum

          # Every line of this heredoc must stay indented at least to
          # this run: block's own indentation; a less-indented line
          # would look like the end of the YAML literal block to the
          # workflow parser, not to bash.
          MSG="chore(deps): bump ieee-2030_5-core-go to ${TARGET_LABEL}

          Automated by .github/workflows/core-freshness.yml. This
          branch is force-updated on every scheduled run, not appended
          to; see the open PR for the current evidence.

          Ref: CI-SETUP"
          git commit -m "$MSG"

      - name: Push chore/bump-core (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          WRITE_TOKEN: ${{ steps.write-token.outputs.token }}
        run: |
          set -euo pipefail
          git push --force \
            "https://x-access-token:${WRITE_TOKEN}@github.com/GRIDAPPSD/ieee-2030_5-server-go.git" \
            HEAD:refs/heads/chore/bump-core

      - name: Open or update the bump PR (only when behind)
        if: steps.compare.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PIN_VERSION: ${{ steps.compare.outputs.pin_version }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          COMMITS: ${{ steps.compare.outputs.commits }}
        run: |
          set -euo pipefail

          {
            echo "Automated by \`.github/workflows/core-freshness.yml\` (staleness-check job). This branch is force-updated on every scheduled run rather than accumulating one PR per day; review the latest push, not the PR history."
            echo
            echo "Pinned version: \`${PIN_VERSION}\`"
            echo "Target: ${TARGET_LABEL}"
            echo "Commits behind: ${BEHIND}"
            echo
            echo "Commits between the current pin and the target:"
            echo '```'
            echo "${COMMITS}"
            echo '```'
            echo
            echo "**A red build on this PR is expected while this repo lags core, not a sign the bump itself is wrong.** The staleness-check job that opened this PR also fails on its own scheduled run, independent of this PR, so the drift is visible even before anyone looks here. If CI fails on this PR, the fix belongs in this repo (or, if core made an unintended breaking change, in core), never by closing or reverting this PR."
          } > /tmp/bump-core-pr-body.md

          existing=$(gh pr list -R GRIDAPPSD/ieee-2030_5-server-go --head chore/bump-core --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R GRIDAPPSD/ieee-2030_5-server-go \
              --title "chore(deps): bump ieee-2030_5-core-go (${BEHIND} commit(s) behind)" \
              --body-file /tmp/bump-core-pr-body.md
            echo "Updated existing PR #$existing"
          else
            gh pr create -R GRIDAPPSD/ieee-2030_5-server-go \
              --head chore/bump-core \
              --base main \
              --title "chore(deps): bump ieee-2030_5-core-go (${BEHIND} commit(s) behind)" \
              --body-file /tmp/bump-core-pr-body.md
            echo "Opened new PR"
          fi

      - name: Fail when the pin is behind
        # Both clauses are load-bearing: the implicit success() hides real
        # drift whenever a bump/push/PR step above failed, and an unset
        # `behind` from a failed compare would annotate drift never measured.
        if: ${{ !cancelled() && steps.compare.outcome == 'success' && steps.compare.outputs.behind != '0' }}
        env:
          PIN_VERSION: ${{ steps.compare.outputs.pin_version }}
          BEHIND: ${{ steps.compare.outputs.behind }}
          TARGET_LABEL: ${{ steps.compare.outputs.target_label }}
        run: |
          echo "::error::Pinned github.com/GRIDAPPSD/ieee-2030_5-core-go (${PIN_VERSION}) is ${BEHIND} commit(s) behind ${TARGET_LABEL}. See the chore/bump-core PR for the commit list."
          exit 1

  conformance-vs-core-main:
    name: CSIP conformance against core main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-core-go
          permission-contents: read

      - name: Configure private module access
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Disable git background maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Supply the IEEE 2030.5 WADL
        # Without this step the WADL-gated conformance tests SKIPPED on
        # every run of this job, `go test` exited 0, and the job reported
        # green while measuring nothing against the standard. The instrument
        # was armed at PR time against a frozen core (ci.yml) and disarmed
        # daily against a moving one (here), which is inverted from where it
        # is needed: core main is exactly the thing whose wire-format drift
        # no compile check catches.
        #
        # required: true, unlike ci.yml. This workflow runs only on `schedule`
        # and `workflow_dispatch`, both of which always execute in the base
        # repository with secrets in scope. There is no fork-pull-request case
        # here, so an absent secret is never legitimate withholding: it is a
        # deleted, empty, or half-rotated secret, and it must fail the job
        # rather than quietly reinstating the skip this card removed.
        uses: ./.github/actions/supply-wadl
        with:
          wadl-xz-b64: ${{ secrets.SEP2_WADL_XZ_B64 }}
          required: 'true'

      - name: Bump core to latest main (in-memory only, never committed)
        run: go get github.com/GRIDAPPSD/ieee-2030_5-core-go@main

      - name: Report resolved core version
        run: go list -m github.com/GRIDAPPSD/ieee-2030_5-core-go

      - name: Confirm the WADL gate is armed
        # Deliberately unconditional, where ci.yml's equivalent is gated on
        # `armed == 'true'`: this job passes required: true above, so there is
        # no legitimate path to reaching this step disarmed. Runs AFTER the core
        # bump so the assertion itself compiles against core main, and BEFORE
        # the long test steps so a disarmed gate fails in seconds.
        #
        # SEP2_WADL_REQUIRED=1 already turns an absent or unreadable WADL into a
        # failure. This adds the positive assertion: TestWADLGateArmed has to
        # PASS, not SKIP and not vanish into "no tests to run", so a green run
        # cannot mean a conformance sweep that measured nothing.
        run: |
          set -euo pipefail
          output=$(go test -run '^TestWADLGateArmed$' -v ./test/conformance/wadl/)
          echo "$output"
          case "$output" in
            *"--- PASS: TestWADLGateArmed"*)
              ;;
            *)
              echo "::error::TestWADLGateArmed did not pass, so the conformance sweep measured nothing against the standard."
              exit 1
              ;;
          esac

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        # `go test ./...`, which includes ./test/conformance/wadl. SEP2_WADL_PATH
        # and SEP2_WADL_REQUIRED reach this step through GITHUB_ENV from the WADL
        # step above, so the conformance sweep runs against core main instead of
        # skipping.
        run: make test

      - name: CSIP harness (default tag)
        # Reuses the repo's own conformance target rather than
        # duplicating the CSIP suite's build/run logic. Production tag
        # only (hooks=off), matching the `csip` job's off axis in
        # ci.yml; the hooks=on mutation-testing axis and its race pass
        # are deliberately not repeated here to keep this scheduled job
        # bounded; hooks=on exercises our own mutation hooks rather
        # than core's served wire format, which is what this workflow
        # is watching for.
        run: make test-csip

      - name: CSIP harness wrapper smoke
        run: make test-csip-server
