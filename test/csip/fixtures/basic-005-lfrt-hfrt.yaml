# #135/#140 fixture - BASIC-005 LFRT/HFRT (CSIP V1.2 Section 8.5).
#
# #140 added the opModLFRTMustTrip and opModHFRTMustTrip
# curve-reference fields to pkg/sep2.DERControlBase. The fixture
# now seeds both, each pointing at the corresponding DERCurve id
# below (Figure 5 LFRT left side, HFRT right side).

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "BASIC-005-FSA"
    description: "BASIC-005 single FSA"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1

der_programs:
  - end_device_id: "0"
    fsa_id: "0"
    id: "0"
    mrid: "BASIC-005-DERP"
    description: "BASIC-005 LFRT/HFRT program"
    primacy: 0
    default_der_control_link: "/edev/0/fsa/0/derp/0/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/0/derp/0/derc"
      all: 1
    der_curve_list_link:
      href: "/dc"
      all: 2

der_controls:
  - end_device_id: "0"
    fsa_id: "0"
    der_program_id: "0"
    id: "0"
    mrid: "BASIC-005-DERC"
    der_control_base:
      op_mod_lfrt_must_trip: 0
      op_mod_hfrt_must_trip: 1

der_curves:
  - id: "0"
    mrid: "BASIC-005-LFRT-MUST-TRIP"
    description: "LFRT must trip envelope (Figure 5 left side)"
    curve_type: 1  # CurveTypeOpModFreqWatt is the closest existing tag.
    curve_data:
      - x: 5800
        y: 160
      - x: 5950
        y: 300
  - id: "1"
    mrid: "BASIC-005-HFRT-MUST-TRIP"
    description: "HFRT must trip envelope (Figure 5 right side)"
    curve_type: 1
    curve_data:
      - x: 6020
        y: 300
      - x: 6200
        y: 160
