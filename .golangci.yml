version: "2"

# vendor/ (when present) needs no entry here: golangci-lint's built-in
# default directory exclusions already skip it, confirmed by running this
# config against a real go mod vendor tree (0 issues reported from vendor/).
# The internal/tls/gotls and internal/tls/ccm exclusions once listed below
# this were removed with those directories; see VENDORED.md history.
run:
  build-tags: []

# Show all issues — golangci-lint defaults cap output at 50 per linter.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  settings:
    staticcheck:
      # Disable quick-fix style suggestions (QF*). These are subjective —
      # explicit forms are often clearer than the suggested transforms,
      # especially for embedded-field selectors that document intent.
      checks:
        - -QF1001  # De Morgan's law (explicit form is clearer)
        - -QF1003  # tagged switch (style preference)
        - -QF1006  # lift into loop condition (style preference)
        - -QF1008  # remove embedded field from selector (explicit is safer)
