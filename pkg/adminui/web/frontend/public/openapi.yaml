                required: [ok, message]
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/UnsupportedContentType' }
        '422': { $ref: '#/components/responses/ErrorJson' }
        '429': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '503': { $ref: '#/components/responses/ErrorJson' }
        '504': { $ref: '#/components/responses/ErrorJson' }

  /api/traffic/clients:
    get:
      tags: [traffic]
      summary: List captured clients
      description: Only mounted when traffic capture handler is enabled.
      responses:
        '200':
          description: Client summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficClient'
                required: [clients]
  /api/traffic/exchanges:
    get:
      tags: [traffic]
      summary: List exchange summaries for one client
      parameters:
        - in: query
          name: client
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Exchange summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficExchangeSummary'
                required: [exchanges]
        '400': { description: Invalid query parameter(s) }
  /api/traffic/exchanges/{id}:
    get:
      tags: [traffic]
      summary: Get one exchange summary
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficExchangeSummary' }
        '400': { description: Invalid id }
        '404': { description: Not found }
        '410': { description: Indexed entry evicted }
  /api/traffic/exchanges/{id}/request:
    get:
      tags: [traffic]
      summary: Download captured request bytes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Captured bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: Invalid id }
        '404': { description: Not found }
        '410': { description: Indexed entry evicted }
  /api/traffic/exchanges/{id}/response:
    get:
      tags: [traffic]
      summary: Download captured response bytes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Captured bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: Invalid id }
        '404': { description: Not found }
        '410': { description: Indexed entry evicted }
  /api/traffic/stream:
    get:
      tags: [traffic]
      summary: SSE stream of exchange summaries
      parameters:
        - in: query
          name: after
          schema: { type: string }
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      responses:
        '200':
          description: Stream
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Invalid resume cursor }
  /api/traffic/stats:
    get:
      tags: [traffic]
      summary: Get capture statistics
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficStats' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authorization header bearer token equals configured admin key.
    cookieAuth:
      type: apiKey
      in: cookie
      name: admin_ticket
      description: Admin browser session cookie.
    mtls:
      type: mutualTLS
      description: Client certificate with admin policy OID.
    ticketQuery:
      type: apiKey
      in: query
      name: ticket
      description: One-time short-lived ticket. Not accepted for sensitive routes.

  responses:
    ErrorJson:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorJsonFR:
      description: Flow-reservation-style error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowReservationRefusal'
    UnsupportedContentType:
      description: Unsupported Content-Type for route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnsupportedContentTypeBody'
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    UnsupportedContentTypeBody:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            accepted:
              type: array
              items: { type: string }

    # ===== IEEE 2030.5 core-derived shared schemas =====
    IEEEDateTimeInterval:
      type: object
      description: Derived from `sep2.DateTimeInterval`.
      properties:
        duration: { type: integer, minimum: 0 }
        start: { type: integer }
      required: [duration, start]
    IEEEActivePower:
      type: object
      description: Derived from `sep2.ActivePower`.
      properties:
        multiplier: { type: integer, minimum: -128, maximum: 127 }
        value: { type: integer, minimum: -32768, maximum: 32767 }
      required: [multiplier, value]
    IEEESignedRealEnergy:
      type: object
      description: Derived from `sep2.SignedRealEnergy`.
      properties:
        multiplier: { type: integer, minimum: -128, maximum: 127 }
        value: { type: integer }
      required: [multiplier, value]
    IEEEEventStatus:
      type: object
      description: Derived from `sep2.EventStatus`.
      properties:
        currentStatus: { type: integer }
        dateTime: { type: integer }
        potentiallySuperseded: { type: boolean }
        potentiallySupersededTime: { type: integer }
        reason: { type: string }
      required: [currentStatus, dateTime, potentiallySuperseded]
    IEEEDERProgram:
      type: object
      description: Derived from `sep2.DERProgram`.
      properties:
        href: { type: string }
        mRID: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 0, maximum: 65535 }
        primacy: { type: integer, minimum: 0, maximum: 255 }
        dERControlListLink:
          type: object
          properties: { href: { type: string } }
      additionalProperties: true
    IEEEDERControlBase:
      type: object
      description: |
        Derived from `sep2.DERControlBase`.
        Only selected fields are expanded here; remaining modeled fields are unresolved in this draft.
      properties:
        opModConnect: { type: boolean }
        opModEnergize: { type: boolean }
        opModTargetW: { $ref: '#/components/schemas/IEEEActivePower' }
      additionalProperties: true

    CertResponse:
      type: object
      properties:
        certPEM: { type: string }
        keyPEM: { type: string }
      required: [certPEM]

    CreateServerCertRequest:
      type: object
      properties:
        hosts:
          type: array
          items: { type: string }
        commonName: { type: string }
        validYears: { type: integer }
      required: [hosts]

    CreateDeviceCertRequest:
      type: object
      properties:
        deviceType: { type: integer }
        hwSerialNum: { type: string }
        hwType: { type: string }
        isTestCert: { type: boolean }
      required: [hwSerialNum]

    CreateDeviceCertResponse:
      type: object
      properties:
        certPEM: { type: string }
        keyPEM: { type: string }
        sfdi: { type: string }
        lfdi: { type: string }
      required: [certPEM, keyPEM, sfdi, lfdi]

    DeviceTypeInfo:
      type: object
      properties:
        value: { type: integer }
        name: { type: string }
        label: { type: string }
      required: [value, name, label]

    CertInfoResponse:
      type: object
      properties:
        lfdi: { type: string }
        sfdi: { type: string }
        subject: { type: string }
        hardwareModuleName: { type: string }
        fingerprint: { type: string }
      required: [lfdi, sfdi, subject, fingerprint]

    DashboardDevice:
      type: object
      properties:
        sfdi: { type: string }
        lfdi: { type: string }
        href: { type: string }
        enabled: { type: boolean }
      required: [sfdi, lfdi, href, enabled]

    DeviceLookupResponse:
      type: object
      properties:
        found: { type: boolean }
        device: { $ref: '#/components/schemas/DashboardDevice' }
      required: [found]

    AddDeviceRequest:
      type: object
      properties:
        sfdi: { type: string }
        lfdi: { type: string }
        name: { type: string }
        kind: { type: string }
        pin: { type: integer, minimum: 0 }
        enabled: { type: boolean }
      required: [sfdi, lfdi, pin, enabled]

    AddDeviceResponse:
      type: object
      properties:
        href: { type: string }
        sfdi: { type: string }
        lfdi: { type: string }
      required: [href, sfdi, lfdi]

    DeviceProfile:
      type: object
      properties:
        lfdi: { type: string }
        name: { type: string }
        kind: { type: string, enum: [aggregator, device] }
      required: [lfdi, name, kind]

    DeviceProfileBody:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: ['', aggregator, device] }

    DeviceProfileListResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/DeviceProfile'
      required: [profiles]

    ContentResult:
      type: object
      properties:
        family: { type: string }
        id: { type: string }
      required: [family, id]

    FSACreateRequest:
      type: object
      properties:
        description: { type: string }
        primacy: { type: integer }
        mRID: { type: string }
      required: [description]

    FSAResponse:
      type: object
      properties:
        href: { type: string }
        mRID: { type: string }
        description: { type: string }
        primacy: { type: integer }
        programs:
          type: array
          items: { type: string }
        devices:
          type: array
          items: { type: string }
        deviceOnly: { type: string }
      required: [href, mRID, description, primacy]

    ProgramDefaultControlView:
      type: object
      properties:
        mRID: { type: string }
        type: { type: string }
        derControlBase: { type: object, additionalProperties: true }
        functions: { type: object, additionalProperties: true }
      required: [mRID, type, derControlBase, functions]

    ProgramTemplateBody:
      type: object
      description: |
        Body used by program template/device program create and update.
        `defaultControl` can be object or null; detailed field-level function schema
        comes from DER control catalog and is partially unresolved in this draft.
      properties:
        description: { type: string }
        primacy: { type: integer }
        mRID: { type: string }
        defaultControl:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true

    ProgramTemplateView:
      type: object
      properties:
        id: { type: string }
        mRID: { type: string }
        description: { type: string }
        primacy: { type: integer }
        version: { type: integer }
        defaultControl: { $ref: '#/components/schemas/ProgramDefaultControlView' }
        copies:
          type: array
          items: { type: string }
      required: [id, mRID, description, primacy, version, copies]

    DeviceProgramView:
      type: object
      properties:
        id: { type: string }
        href: { type: string }
        mRID: { type: string }
        description: { type: string }
        primacy: { type: integer }
        version: { type: integer }
        defaultControl: { $ref: '#/components/schemas/ProgramDefaultControlView' }
      required: [id, href, mRID, description, primacy, version]

    ProgramListItem:
      type: object
      properties:
        device: { type: string }
        fsa: { type: string }
        id: { type: string }
        href: { type: string }
        mRID: { type: string }
        description: { type: string }
        primacy: { type: integer }
        version: { type: integer }
        origin: { type: string }
        templateId: { type: string }
        onRestart: { type: string }
      required: [device, fsa, id, href, mRID, description, primacy, version, origin, onRestart]

    ProgramListReply:
      type: object
      properties:
        persists: { type: boolean }
        total: { type: integer }
        start: { type: integer }
        limit: { type: integer }
        programs:
          type: array
          items: { $ref: '#/components/schemas/ProgramListItem' }
      required: [persists, total, start, limit, programs]

    ManagementPairRequest:
      type: object
      properties:
        managerLFDI: { type: string }
        managedLFDI: { type: string }
      required: [managerLFDI, managedLFDI]

    PairMemberHealth:
      type: object
      properties:
        lfdi: { type: string }
        hasRecord: { type: boolean }
        lastSeen: { type: string, nullable: true }
      required: [lfdi, lastSeen]

    ManagementPairCreated:
      type: object
      properties:
        managerLFDI: { type: string }
        managedLFDI: { type: string }
        managed: { $ref: '#/components/schemas/PairMemberHealth' }
        warning: { type: string }
      required: [managerLFDI, managedLFDI, managed]

    ManagementRekeyRequest:
      type: object
      properties:
        role: { type: string, enum: [manager, managed] }
        from: { type: string }
        to: { type: string }
      required: [role, from, to]

    DeviceLogLine:
      type: object
      description: Unresolved exact shape from `devicelog.Line`.
      additionalProperties: true

    DeviceLogResponse:
      type: object
      properties:
        lfdi: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DeviceLogLine' }
        nextBefore: { type: string, nullable: true }
        nextAfter: { type: string, nullable: true }
        rotatedRead: { type: boolean }
        dropped: { type: integer }
      required: [lfdi, entries, rotatedRead, dropped]

    FleetMeasurement:
      type: object
      properties:
        value: { type: number }
        readingTime: { type: integer }
        qualityFlags: { type: integer }
        directionUnknown: { type: boolean }
      required: [value, readingTime]

    FleetDeviceMeasurements:
      type: object
      properties:
        p: { $ref: '#/components/schemas/FleetMeasurement' }
        q: { $ref: '#/components/schemas/FleetMeasurement' }
        v: { $ref: '#/components/schemas/FleetMeasurement' }
        f: { $ref: '#/components/schemas/FleetMeasurement' }

    FleetDeviceStatus:
      type: object
      properties:
        connected: { type: boolean }
        operationalMode: { type: integer }
        alarmStatus: { type: integer }
        stateOfCharge: { type: integer }
        readingTime: { type: integer }

    FleetDeviceAvailability:
      type: object
      properties:
        statWAvail: { type: number }
        statVarAvail: { type: number }
        readingTime: { type: integer }

    FleetDevice:
      type: object
      properties:
        lfdi: { type: string }
        edevId: { type: string }
        href: { type: string }
        status: { $ref: '#/components/schemas/FleetDeviceStatus' }
        availability: { $ref: '#/components/schemas/FleetDeviceAvailability' }
        measurements: { $ref: '#/components/schemas/FleetDeviceMeasurements' }
      required: [lfdi, measurements]

    FleetSum:
      type: object
      properties:
        sum: { type: number }
        unreported: { type: integer }
        stale: { type: integer }
        directionUnknown: { type: boolean }
      required: [sum, unreported, stale, directionUnknown]

    FleetRollup:
      type: object
      properties:
        deviceCount: { type: integer }
        connected: { type: integer }
        alarmed: { type: integer }
        stale: { type: integer }
        p: { $ref: '#/components/schemas/FleetSum' }
        q: { $ref: '#/components/schemas/FleetSum' }
        statWAvail: { $ref: '#/components/schemas/FleetSum' }
        statVarAvail: { $ref: '#/components/schemas/FleetSum' }
      required: [deviceCount, connected, alarmed, stale, p, q, statWAvail, statVarAvail]

    Fleet:
      type: object
      properties:
        aggregatorLFDI: { type: string }
        devices:
          type: array
          items: { $ref: '#/components/schemas/FleetDevice' }
        rollup: { $ref: '#/components/schemas/FleetRollup' }
      required: [aggregatorLFDI, devices, rollup]

    PowerDevice:
      type: object
      additionalProperties: true

    AggregatorEnergy:
      type: object
      additionalProperties: true

    PowerResponse:
      type: object
      description: Chart payload produced by admin power route.
      properties:
        scope: { type: string }
        aggregatorLFDI: { type: string }
        aggregators:
          type: array
          items: { type: string }
        windowStart: { type: integer }
        windowEnd: { type: integer }
        bucketSeconds: { type: integer }
        chart:
          description: Raw chart JSON payload
        energyChart:
          description: Raw chart JSON payload
        devices:
          type: array
          items: { $ref: '#/components/schemas/PowerDevice' }
        notReporting:
          type: array
          items: { type: string }
        totalGapBuckets: { type: integer }
        readingsExpired: { type: boolean }
        latestW: { type: number }
        latestAt: { type: integer }
        latestMissing:
          type: array
          items: { type: string }
        aggregatorEnergy:
          type: array
          items: { $ref: '#/components/schemas/AggregatorEnergy' }
      required: [scope, aggregators, windowStart, windowEnd, bucketSeconds, chart, energyChart, devices, notReporting, totalGapBuckets, readingsExpired, latestMissing, aggregatorEnergy]

    DERReadReply:
      type: object
      description: Output of GET /api/derms/devices/{edevId}/ders
      additionalProperties: true

    ControlEvent:
      type: object
      properties:
        group: { type: string }
        groupKind: { type: string }
        scope: { type: string }
        fsaID: { type: string }
        deviceIDs:
          type: array
          items: { type: string }
        mrid: { type: string }
        origin: { type: string }
        direction: { type: string, nullable: true }
        targetW: { type: number, nullable: true }
        modes:
          type: array
          items: { type: string }
        status: { type: string }
        start: { type: integer }
        end: { type: integer }
      required: [group, groupKind, scope, deviceIDs, mrid, origin, modes, status, start, end]

    ControlEventsResponse:
      type: object
      properties:
        windowStart: { type: integer }
        windowEnd: { type: integer }
        ahead: { type: integer }
        aheadEnd: { type: integer }
        events:
          type: array
          items: { $ref: '#/components/schemas/ControlEvent' }
      required: [windowStart, windowEnd, ahead, aheadEnd, events]

    FlowReservationRefusal:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
        mRID: { type: string }
        frqId: { type: string }
        cancelled:
          type: array
          items: { type: string }
        unresolved:
          type: array
          items: { type: string }
      required: [error, code]

    FlowReservationWriteBody:
      type: object
      properties:
        decision: { type: string, enum: [grant, deny] }
        interval: { $ref: '#/components/schemas/IEEEDateTimeInterval' }
        energy:
          type: object
          properties:
            value: { type: integer, minimum: 0 }
            multiplier: { type: integer, minimum: -9, maximum: 9 }
        power:
          type: object
          properties:
            value: { type: integer, minimum: 0 }
            multiplier: { type: integer, minimum: -9, maximum: 9 }
        reason: { type: string }
      required: [decision]

    FlowReservationCancelBody:
      type: object
      properties:
        reason: { type: string }

    FlowReservationExecutionView:
      type: object
      additionalProperties: true

    FlowReservationResponseView:
      type: object
      additionalProperties: true

    FlowReservationView:
      type: object
      additionalProperties: true

    FlowReservationList:
      type: object
      properties:
        aggregatorLFDI: { type: string }
        now: { type: integer }
        deadlineSeconds: { type: integer }
        persisted: { type: boolean }
        requests:
          type: array
          items: { $ref: '#/components/schemas/FlowReservationView' }
      required: [aggregatorLFDI, now, deadlineSeconds, persisted, requests]

    FlowReservationGrantList:
      type: object
      additionalProperties: true

    CommittedGrantView:
      type: object
      additionalProperties: true

    CommittedControlView:
      type: object
      additionalProperties: true

    CommitmentsView:
      type: object
      properties:
        aggregatorLFDI: { type: string }
        now: { type: integer }
        grants:
          type: array
          items: { $ref: '#/components/schemas/CommittedGrantView' }
        plainControls:
          type: array
          items: { $ref: '#/components/schemas/CommittedControlView' }
      required: [aggregatorLFDI, now, grants, plainControls]

    DERControlCreateBody:
      type: object
      description: |
        Body for POST /api/der/controls.
        Full per-function value schema is catalog-driven and only partly expanded in this draft.
      properties:
        derProgramHref: { type: string }
        type: { type: string }
        functions:
          type: object
          additionalProperties: true
        startTime: { type: integer }
        durationSeconds: { type: integer }
        description: { type: string }
        executesGrant: { type: string }
      required: [derProgramHref, durationSeconds]

    DERControlConflict:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
        mRID: { type: string }
      required: [error, code, mRID]

    DERControlView:
      type: object
      properties:
        mRID: { type: string }
        href: { type: string }
        derProgramHref: { type: string }
        derControlListHref: { type: string }
        type: { type: string }
        description: { type: string }
        derControlBase: { $ref: '#/components/schemas/IEEEDERControlBase' }
        functions:
          type: object
          additionalProperties: true
        creationTime: { type: integer }
        interval: { $ref: '#/components/schemas/IEEEDateTimeInterval' }
        ended: { type: boolean }
        eventStatus:
          type: object
          properties:
            currentStatus: { type: integer }
            status: { type: string }
            dateTime: { type: integer }
          required: [currentStatus, status, dateTime]
        executesGrant: { type: string }
        origin: { type: string }
        direction: { type: string, nullable: true }
      required: [mRID, href, derProgramHref, derControlListHref, type, description, derControlBase, functions, creationTime, ended, origin]

    DERControlCreated:
      allOf:
        - $ref: '#/components/schemas/DERControlView'
        - type: object
          properties:
            supersedes:
              type: array
              items: { type: string }
            notificationAttempted: { type: boolean }
            persisted: { type: boolean }
          required: [supersedes, notificationAttempted, persisted]

    DERControlList:
      type: object
      properties:
        device: { type: string }
        controls:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [device, controls]

    DeviceControlBody:
      allOf:
        - $ref: '#/components/schemas/DERControlCreateBody'
        - type: object
          properties:
            kind:
              type: string
              enum: [scheduled, default]
          required: [kind]

    DeviceControlCreated:
      type: object
      additionalProperties: true

    DERProgramListView:
      type: object
      properties:
        device: { type: string }
        programs:
          type: array
          items:
            type: object
            properties:
              href: { type: string }
              mRID: { type: string }
              description: { type: string }
              primacy: { type: integer }
              derControlListHref: { type: string }
      required: [device, programs]

    FSAControlBody:
      type: object
      description: FSA control create body; similar to DER control create without `derProgramHref`.
      properties:
        type: { type: string }
        functions:
          type: object
          additionalProperties: true
        startTime: { type: integer }
        durationSeconds: { type: integer }
        description: { type: string }
      required: [durationSeconds]

    FSAControlView:
      type: object
      additionalProperties: true

    FSAControlCreated:
      allOf:
        - $ref: '#/components/schemas/FSAControlView'
        - type: object
          properties:
            notificationAttempted: { type: boolean }
            persisted: { type: boolean }
          required: [notificationAttempted, persisted]

