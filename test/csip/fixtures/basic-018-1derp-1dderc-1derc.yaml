# #143 / BASIC-018 fixture — CSIP V1.2 §8.18.
#
# Topology: 1 DERProgram, 1 DefaultDERControl, 1 DERControl. The
# DDERC carries opModFixedW = 2000 (20.00%) (the fallback when no event is
# active); the DERControl carries opModFixedW = 3000 (30.00%) with Interval
# [t0+60, t0+180) and EventStatus = Scheduled. Per §8.18 the client
# applies DDERC while the event is scheduled, then transitions to
# DERControl when active. Server-side just asserts the fixture renders.

