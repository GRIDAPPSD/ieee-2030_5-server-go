# IEEE-105: CI workflow scaffold (Plan 2 Phase 7 ticket 1 of 2).
# IEEE-106: CSIP harness integration + archive-grade logs (ticket 2 of 2).
# IEEE-109: workflow_dispatch entry point for re-attestation runs.
#
# Standard Go signal: build, vet, lint, test, test-race, coverage (`ci` job).
# CSIP V1.2 harness: build-tag matrix (csip_test_hooks off/on) plus race
# detector on the hooks-on suite. Per-job stdout/stderr is teed to a file
# and uploaded as a workflow artifact with 90-day retention so Phase 9
# IEEE-109 can index the archive-grade evidence.
#
# Re-attestation runs (IEEE-109): `gh workflow run ci.yml --ref <SHA>`.
# `workflow_dispatch` lets us pin a CI run to a specific main SHA for the
# conformance package without pushing a fresh commit. After the run
# completes, `scripts/archive-ci-logs.sh <run-id>` mirrors the artifacts
# into the Knowledge workspace at projects/ieee-2030_5-go/artifacts/
# outputs/ci-archive/.
#
# Runner: ubuntu-latest. This is a documented exception to the
# workspace `runs-on: self-hosted` policy; see .claude/rules/devops.md.
# Rationale: third-party-org repo (GRIDAPPSD), test-only CI (no deploy,
# no secrets, no docker push). Self-hosted is reserved for projects with
# deploy-bearing CI.
# Coverage gate is warn-not-fail at this stage; IEEE-107 (Phase 8) ratchets
# the gate to fail at the achieved threshold.
name: ci

on:
  # paths-ignore: doc-only changes do not affect build artifacts in this repo
  # (godoc is consumed externally, not embedded into a release artifact). See
  # .claude/rules/devops.md "Documentation-only changes should not trigger a
  # full CI rebuild"; invert this list if docs ever become part of the build.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g. "IEEE-108 re-attestation against SHA xyz")'
        required: false
        default: 'manual'

# Cancel in-flight runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: build / vet / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # IEEE-116: Plan-4 decision 2: PR-gate runs property tests with a
      # pinned RAPID_SEED for deterministic, reproducible failures.
      # Reproduction: re-run with the same seed to get the same shrunk
      # counterexample. A nightly cron job with time-based seeding (broader
      # exploration) is a separate follow-up (out of IEEE-116 scope).
      # Seed is a non-zero integer; value 1747227600 derived from plan-4
      # approval timestamp 2026-05-14T15:00:00Z.
      RAPID_SEED: 1747227600
      # IEEESRV-018: required so `go` resolves github.com/GRIDAPPSD/*
      # over the token-authenticated git insteadOf rewrite instead of
      # trying (and failing) an anonymous proxy/checksum-db lookup.
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        # IEEE-124: bumped v4->v6 for Node.js 24 runtime.
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        # IEEESRV-018: private-core CI token wiring. Mints a short-lived
        # installation token for the GRIDAPPSD App (referenced by App ID
        # via secret, not by slug) so `go build`/`go vet`/`go test` below
        # can resolve the private github.com/GRIDAPPSD/ieee-2030_5-core-go
        # module. Pinned to v3 (current stable major as of 2026-07-07).
        # The action masks the token in logs; it is never echoed.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD

      - name: Configure private module access
        # Rewrites HTTPS clones/fetches of github.com/GRIDAPPSD/* to carry
        # the minted installation token, scoped to this org only. Runs
        # before Setup Go so `go build`'s module resolution can see it.
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/GRIDAPPSD/".insteadOf "https://github.com/GRIDAPPSD/"

      - name: Setup Go
        # IEEE-124: bumped v5->v6 for Node.js 24 runtime.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Lint
        # golangci-lint v2.12.2 is built with go1.26.2 and supports modules
        # declaring `go 1.26.3` in go.mod. Earlier releases (through v2.9.0)
        # were compiled with go1.25 and reject go1.26 modules at startup.
        # Config schema is unchanged (v2). See `.golangci.yml`.
        # The action installs the binary (cached across runs) and runs it.
        # golangci-lint-action@v9 ships Node.js 24 (v9.0.0 release).
        # The `version:` input name is unchanged from v7.
        # IEEE-124: bumped v7->v9 for Node.js 24 runtime.
        # IEEE-174: bumped v2.9.0->v2.12.2 for go1.26 toolchain support.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Supply the IEEE 2030.5 WADL
        id: wadl
        # The WADL is copyrighted by IEEE and is not in this repository (see
        # NOTICE). First-party runs reassemble a licensed copy from a
        # repository secret into a file OUTSIDE the checkout and point
        # SEP2_WADL_PATH at it. A run with no secret in scope (a pull request
        # from a fork, or any run GitHub withholds secrets from) skips the
        # WADL-gated tests and still reports green.
        #
        # Unlike the schema in the core module, which needs two secrets
        # because it exceeds GitHub's per-secret ceiling once sealed, the
        # WADL fits in a single value. Do not split it.
        #
        # Nothing below echoes the secret or the decoded file, and printf is a
        # shell builtin, so no part reaches a process argument list either.
        env:
          WADL_XZ_B64: ${{ secrets.SEP2_WADL_XZ_B64 }}
        run: |
          set -euo pipefail

          # Transport check on the reassembly only: these describe the bytes
          # sealed into the secret (IEEE 2030.5-2018 Model Build 20180301
          # sep_wadl.xml). The document's identity is pinned independently and
          # more strongly by the Go loader, over a normalized sha256 (see
          # test/conformance/wadl/wadl.go). If the secret is ever resealed
          # from a copy with different line endings, update these two values;
          # the Go-side digest is unaffected.
          want_md5=949b3f54ddf3252c4500807c77009bc9
          want_bytes=220733

          # An empty secret is legitimate absence: GitHub withholds secrets
          # from fork pull requests, and an outside contributor's run has to
          # stay green with the gated tests skipped.
          if [ -z "${WADL_XZ_B64:-}" ]; then
            echo "No WADL secret in scope for this run (fork pull request, or secret withheld)."
            echo "Leaving SEP2_WADL_REQUIRED unset: the WADL-gated tests SKIP and the run stays green."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! command -v xz > /dev/null; then
            echo "::error::xz is not installed on this runner, so the WADL cannot be decompressed."
            exit 1
          fi

          # Written outside the checkout on purpose. RUNNER_TEMP is not the
          # repo working tree, so the file cannot be committed, is not visible
          # to anything that globs the tree, and is not part of any path a
          # later step would upload as an artifact. The runner deletes it when
          # the job ends.
          dest_dir="${RUNNER_TEMP:?RUNNER_TEMP is unset}/sep2-wadl"
          case "$dest_dir" in
            "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset}"/*)
              echo "::error::Refusing to write the WADL inside the repository working tree."
              exit 1
              ;;
          esac
          umask 077
          mkdir -p "$dest_dir"
          dest="$dest_dir/sep_wadl.xml"

          if ! printf '%s' "$WADL_XZ_B64" \
            | tr -d '[:space:]' \
            | base64 -d \
            | xz -d > "$dest"; then
            rm -f "$dest"
            echo "::error::Could not reassemble sep_wadl.xml from SEP2_WADL_XZ_B64. The value must be one base64 string holding an xz stream."
            exit 1
          fi

          got_bytes=$(wc -c < "$dest")
          got_md5=$(md5sum < "$dest" | cut -d ' ' -f 1)
          if [ "$got_bytes" != "$want_bytes" ] || [ "$got_md5" != "$want_md5" ]; then
            rm -f "$dest"
            echo "::error::Reassembled WADL is not the expected document: $got_bytes bytes, md5 $got_md5; want $want_bytes bytes, md5 $want_md5. A truncated or half-rotated secret is the likely cause; reseal from one copy."
            exit 1
          fi
          echo "Reassembled sep_wadl.xml: $got_bytes bytes, md5 matches."

          # Only reached once the file on disk is verified, so no path gets to
          # go test with a WADL configured but unchecked, and none gets there
          # with the secret present but REQUIRED unset.
          {
            echo "SEP2_WADL_PATH=$dest"
            echo "SEP2_WADL_REQUIRED=1"
          } >> "$GITHUB_ENV"
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the WADL gate is armed
        if: steps.wadl.outputs.armed == 'true'
        # SEP2_WADL_REQUIRED=1 already turns an absent or unreadable WADL into
        # a failure. This adds the positive assertion: TestWADLGateArmed has
        # to PASS, not SKIP and not vanish into "no tests to run", so a green
        # run cannot mean a conformance sweep that measured nothing against
        # the standard.
        run: |
          set -euo pipefail
          output=$(go test -run '^TestWADLGateArmed$' -v ./test/conformance/wadl/)
          echo "$output"
          case "$output" in
            *"--- PASS: TestWADLGateArmed"*)
              ;;
            *)
              echo "::error::A WADL was supplied but TestWADLGateArmed did not pass, so the conformance sweep measured nothing."
              exit 1
              ;;
          esac

      - name: Test
        # SEP2_WADL_PATH and SEP2_WADL_REQUIRED reach this step through
        # GITHUB_ENV from the WADL step above, when and only when the secret
        # was in scope.
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Test (coverage)
        # Aggregate `./...` coverage profile for the upload artifact.
        # The fail-gate operates on the CSIP-scoped profile in the
        # `csip` job below (IEEE-107): this step stays informational
        # because the vendored internal/tls/gotls/ fork drags the
        # aggregate well below policy and is not in the conformance
        # scope.
        run: make test-cover

      - name: Upload coverage artifact
        if: always()
        # IEEE-124: bumped v4->v7 for Node.js 24 runtime.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn
          retention-days: 14

  # IEEE-106: CSIP V1.2 harness with the csip_test_hooks build-tag matrix.
  #
  # Two parallel jobs: tag `off` exercises the production code path, tag
  # `on` exercises the IEEE-024/025 mutation + time-advance hooks. Both
  # must pass for the workflow to be green.
  #
  # The harness covers `./test/csip/...` and `./internal/...` so production
  # paths reached by CSIP tests participate in the captured signal. After
  # the matrix call, the hooks-on job runs the race detector against the
  # CSIP suite catches subscription-fan-out / aggregator races the unit
  # race pass might not surface.
  #
  # Archive-grade logs: each `go test` invocation tees stdout+stderr to a
  # per-step `.log` file via the Makefile-equivalent inline command, and
  # the per-job artifact ships at 90-day retention (GitHub max). Phase 9
  # IEEE-109 indexes these into the Knowledge repo and mirrors the bulk
  # tarball to the durable store it owns.
  csip:
    name: csip harness (hooks=${{ matrix.hooks }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        hooks: [off, on]
    env:
      # `SEP2_TEST_MUTATION_TOKEN` gates the IEEE-024 mutation surface in
      # hooks-on builds; without it, those endpoints stay disabled and the
      # binary logs a warning. The csip_test_hooks suite tolerates an
      # empty token (mutation-dependent tests skip), but CI exercises the
      # full path by providing a per-run token. Not a secret: the
      # mutation surface only exists in -tags csip_test_hooks builds and
      # only listens on the in-process test server.
      SEP2_TEST_MUTATION_TOKEN: ci-${{ github.run_id }}
      # IEEESRV-018: same private-module resolution requirement as
      # the ci job above; each job runs on a fresh runner.
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        # IEEE-124: bumped v4->v6 for Node.js 24 runtime.
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        # IEEESRV-018: private-core CI token wiring. Mints a short-lived
        # installation token for the GRIDAPPSD App (referenced by App ID
        # via secret, not by slug) so `go build`/`go vet`/`go test` below
        # can resolve the private github.com/GRIDAPPSD/ieee-2030_5-core-go
        # module. Pinned to v3 (current stable major as of 2026-07-07).
        # The action masks the token in logs; it is never echoed.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD

      - name: Configure private module access
        # Rewrites HTTPS clones/fetches of github.com/GRIDAPPSD/* to carry
        # the minted installation token, scoped to this org only. Runs
        # before Setup Go so `go build`'s module resolution can see it.
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/GRIDAPPSD/".insteadOf "https://github.com/GRIDAPPSD/"

      - name: Setup Go
        # IEEE-124: bumped v5->v6 for Node.js 24 runtime.
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: CSIP harness (default tag)
        if: matrix.hooks == 'off'
        # `set -o pipefail` so `tee` does not mask test failures.
        # The Makefile `test-csip` target wraps `go test ./test/csip/...
        # ./internal/...` under the production build tag.
        shell: bash
        run: |
          set -o pipefail
          make test-csip 2>&1 | tee ci-logs/csip-tag-off.log

      - name: CSIP harness wrapper smoke (scripts/test-csip-server.sh)
        if: matrix.hooks == 'off'
        # Validates the CLAUDE.md-referenced `make test-csip-server` entry
        # point keeps working alongside the new make targets. The script
        # wraps `go test -v ./test/csip/...` (production tag) and skips
        # cleanly when SunSpec PKI fixtures are absent.
        shell: bash
        run: |
          set -o pipefail
          make test-csip-server 2>&1 | tee ci-logs/csip-server-script.log

      - name: CSIP harness (csip_test_hooks tag)
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make test-csip-hooks 2>&1 | tee ci-logs/csip-tag-on.log

      - name: CSIP harness race detector (csip_test_hooks tag)
        if: matrix.hooks == 'on'
        # Race only runs on the hooks-on axis (per Phase 7 doc): the
        # mutation + time-advance hooks are the surface most likely to
        # surface subscription-fan-out / aggregator races.
        shell: bash
        run: |
          set -o pipefail
          make test-csip-race 2>&1 | tee ci-logs/csip-race.log

      - name: CSIP scoped coverage profile (csip_test_hooks tag)
        # IEEE-107 Deliverable 3: runs the CSIP suite once more under
        # the hooks-on axis with the scoped -coverpkg set so the gate
        # operates on production code reachable from CSIP-mode
        # execution. Achieved 79.1% at IEEE-106 merge; gate floors at
        # 78% (1pp below for measurement noise).
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make test-csip-cover 2>&1 | tee ci-logs/csip-cover.log

      # Temporarily non-blocking per IEEESRV-021: CSIP coverage is 77.1% vs the 80% gate
      # (pre-existing debt surfaced when GitHub CI was first enabled). Remove continue-on-error
      # once CSIP coverage is back at >=80%.
      - name: CSIP coverage gate (fail-at-threshold)
        # IEEE-107: flips the gate from warn-not-fail (IEEE-105) to
        # fail at the achieved threshold. Unit-tested by
        # scripts/coverage_gate_test.go.
        continue-on-error: true
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make coverage-gate 2>&1 | tee ci-logs/csip-coverage-gate.log

      - name: Upload CSIP archive-grade logs
        if: always()
        # 90-day retention = GitHub Actions max. Phase 9 IEEE-109 indexes
        # these artifacts into Knowledge and mirrors the bulk tarball to
        # the long-term durable store it owns.
        # IEEE-124: bumped v4->v7 for Node.js 24 runtime.
        uses: actions/upload-artifact@v7
        with:
          name: csip-logs-${{ matrix.hooks }}-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload CSIP scoped coverage profile
        # IEEE-107: separate artifact so Phase 9 IEEE-109 can pull the
        # scoped profile directly without parsing ci-logs/. Hooks-on
        # axis only (the axis that runs `make test-csip-cover`).
        # IEEE-124: bumped v4->v7 for Node.js 24 runtime.
        if: matrix.hooks == 'on' && always()
        uses: actions/upload-artifact@v7
        with:
          name: csip-coverage-${{ github.sha }}
          path: coverage-csip.out
          if-no-files-found: warn
          retention-days: 90

  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No App token here: gofmt -l only reads and parses the local tree,
    # it never resolves a Go module or touches network.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          # One violation was found and fixed in the same change that
          # added this check (test/stress/loadgen/loadgen_test.go, a
          # struct-literal alignment fix with no semantic change; not
          # vendored). No exclusion is needed here as a result: the
          # check is unconditionally blocking. If a future vendored or
          # generated file needs a carve-out, add it here narrowly and
          # comment why, matching the pattern in
          # ieee-2030_5-core-go's ci.yml gofmt job.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt check passed."
