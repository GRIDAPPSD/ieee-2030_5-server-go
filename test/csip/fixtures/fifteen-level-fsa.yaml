# IEEE-064 fixture — 15-level FSA priority chain for CORE-011.
#
# Extends IEEE-057's seven-level-fsa.yaml pattern from 7 levels to 15
# levels. One EndDevice; fifteen FunctionSetAssignments hung off it,
# each pointing at a DERProgramList that contains exactly one
# DERProgram. DERProgram primacy values ascend 0..14 (lower primacy =
# higher priority per spec §10.2; L0 is the system-level top, L14 the
# closest-to-the-inverter device-immediate program).
#
# CSIP V1.2 does not mandate a vocabulary for the 15-level hierarchy
# beyond what Noor's V1.2 matrix Section 4 documents. The level names
# below are chosen by IEEE-064 for descriptive value; the assertions
# in core_011_fsa_fifteen_level_test.go key on primacy ordering and
# the deterministic ID-as-zero-padded-int ordering produced by the
# FSA store's key sort. They do NOT key on the descriptions.
#
# Priority chain (utility -> field -> device granularity; finer
# than the 7-level chain — adds intermediate primacy levels for
# day-ahead / hour-ahead / real-time horizons and per-zone overrides
# so the chain exercises the same priority-ordering invariant as
# CORE-010 with twice the depth):
#
#   primacy  0  L0-day-ahead         System operator, day-ahead horizon.
#   primacy  1  L1-hour-ahead        System operator, hour-ahead horizon.
#   primacy  2  L2-rto-realtime      RTO real-time dispatch.
#   primacy  3  L3-balancing-area    Balancing authority area program.
#   primacy  4  L4-substation        Substation-level program.
#   primacy  5  L5-feeder            Feeder section program.
#   primacy  6  L6-lateral           Lateral / branch program.
#   primacy  7  L7-zone              Voltage / VAR zone program.
#   primacy  8  L8-transformer       Service transformer.
#   primacy  9  L9-service-point     Service Point per CSIP §3.2.
#   primacy 10  L10-meter            Revenue meter.
#   primacy 11  L11-aggregator       Aggregator override program.
#   primacy 12  L12-site             Site / behind-the-meter program.
#   primacy 13  L13-device-group     Device group / fleet program.
#   primacy 14  L14-immediate        Closest-to-inverter immediate program.
#
# CORE-011 procedure: client follows /dcap -> /edev -> /edev/0/fsa
# (this list, all=15) -> each FSA -> DERProgramList -> single
# DERProgram. The 15 FSAs are emitted in ID order (FSA store sorts
# its keys). Two-digit zero padding ("00".."14") so lexicographic
# sort matches numeric sort across the 10-boundary.

