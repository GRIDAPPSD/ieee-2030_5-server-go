# #139 fixture — Utility-Aggregator topology for UTIL-001..UTIL-004
# (CSIP V1.2 §9.1-§9.4). Per Noor's V1.2 coverage matrix Section 2 this is
# "the heaviest fixture in the matrix" — bigger than #52's
# seven-level-fsa.yaml (1 EndDevice, 7 FSAs, 7 DERPrograms).
#
# Topology shape:
#
#   5 EndDevices:
#     - EDFI  (id="0") — the Aggregator itself (Utility-side end device).
#     - EDA1  (id="1") — managed inverter A1.
#     - EDA2  (id="2") — managed inverter A2.
#     - EDB1  (id="3") — managed inverter B1.
#     - EDB2  (id="4") — managed inverter B2.
#
#   4-level FSA chain per managed inverter:
#
#     SY (system, primacy 0)
#       ├── FDA (feeder A, primacy 1)
#       │     ├── SPA1 (service point A1, primacy 2)
#       │     │     └── DEV-EDA1 (device, primacy 3)  → EDA1
#       │     └── SPA2 (service point A2, primacy 2)
#       │           └── DEV-EDA2 (device, primacy 3)  → EDA2
#       └── FDB (feeder B, primacy 1)
#             ├── SPB1 (service point B1, primacy 2)
#             │     └── DEV-EDB1 (device, primacy 3)  → EDB1
#             └── SPB2 (service point B2, primacy 2)
#                   └── DEV-EDB2 (device, primacy 3)  → EDB2
#
#   Per managed inverter the 4 FSAs (SY/FDx/SPxx/DEV) are hung off that
#   inverter's EndDevice. Each FSA points to ONE DERProgram. The total
#   distinct DERPrograms across the topology is 7:
#     SY (1), FDA + FDB (2), SPA1 + SPA2 + SPB1 + SPB2 (4) = 7 nodes.
#   Per-inverter device-level DERPrograms are 4 additional (DEV-EDA1..B2)
#   but they are scoped under each inverter's EndDevice — the spec models
#   the "node" tree above as the shared utility/feeder/service-point
#   hierarchy, while the device program is per-inverter. Total DERPrograms
#   stored = 7 shared nodes × 4 inverters (each inverter sees the chain
#   from its perspective via FSA→DERProgramList) + 4 device-level
#   programs. The loader keys DERPrograms by EndDevice (see csiptest
#   loader doc); we replicate the per-inverter chain so each managed
#   inverter's FSA→DERProgram walk surfaces the full SY→FDx→SPxx→DEV
#   priority chain.
#
# The Aggregator EDFI (id="0") gets a single FSA → its own DERProgram so
# UTIL-002's "find own EDFI" step has something coherent to discover.
# It does NOT carry the full inverter topology — it is the management
# endpoint, not a managed inverter.
#
# SFDI/LFDI are fabricated test values per the same convention as
# three-edev.yaml (real-cert-derivation is out of scope for UTIL tests
# that don't drive against a SunSpec V1.2 leaf).
#
# #147 (AGG-001..012) will reuse this fixture wholesale. Do not add
# UTIL-004-specific DERControls here — those are created at test time
# by the procedure step.

end_devices:
  - id: "0"
    sfdi: "100000000001"
    lfdi: "1000000000000000000000000000000000000001"
    enabled: true
    changed_time: 1700000000
    registration_link: "/edev/0/rg"
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1
    der_list_link:
      href: "/edev/0/der"
