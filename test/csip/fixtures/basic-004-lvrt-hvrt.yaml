# #135/#140 fixture - BASIC-004 LVRT/HVRT (CSIP V1.2 Section 8.4).
#
# #140 added the four LVRT/HVRT curve-ref fields to
# pkg/sep2.DERControlBase. The fixture now seeds all four, each
# pointing at the corresponding DERCurve id in /dc; the procedure
# walk asserts each ref round-trips on the wire and the curve-list
# carries the four ride-through curves.

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "BASIC-004-FSA"
    description: "BASIC-004 single FSA"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1

der_programs:
  - end_device_id: "0"
    fsa_id: "0"
    id: "0"
    mrid: "BASIC-004-DERP"
    description: "BASIC-004 LVRT/HVRT program"
    primacy: 0
    default_der_control_link: "/edev/0/fsa/0/derp/0/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/0/derp/0/derc"
      all: 1
    der_curve_list_link:
      href: "/dc"
      all: 4

der_controls:
  - end_device_id: "0"
    fsa_id: "0"
    der_program_id: "0"
    id: "0"
    mrid: "BASIC-004-DERC"
    der_control_base:
      # Curve IDs reference der_curves[].id below. #140 fields.
      op_mod_lvrt_must_trip: 0
      op_mod_lvrt_momentary_cessation: 1
      op_mod_hvrt_must_trip: 2
      op_mod_hvrt_momentary_cessation: 3

# Four curves: LVRT-must-trip, LVRT-momentary-cessation, HVRT-must-trip,
# HVRT-momentary-cessation. The sep2 DERCurve type today does not
# carry a "ride-through mode" sub-classifier; curveType=0 (VoltVar) is
# the closest existing tag. The procedure walk renders these as
# generic curves; the per-mode assertion that would discriminate them
# by sub-type is pinned by #140.
der_curves:
  - id: "0"
    mrid: "BASIC-004-LVRT-MUST-TRIP"
    description: "LVRT must trip envelope"
    curve_type: 0
    curve_data:
      - x: 5000
        y: 100
      - x: 7000
        y: 1000
  - id: "1"
    mrid: "BASIC-004-LVRT-MOMENTARY"
    description: "LVRT momentary cessation"
    curve_type: 0
    curve_data:
      - x: 8000
        y: 0
      - x: 8800
        y: 0
  - id: "2"
    mrid: "BASIC-004-HVRT-MUST-TRIP"
    description: "HVRT must trip envelope"
    curve_type: 0
    curve_data:
      - x: 11000
        y: 100
      - x: 12000
        y: 1000
  - id: "3"
    mrid: "BASIC-004-HVRT-MOMENTARY"
    description: "HVRT momentary cessation"
    curve_type: 0
    curve_data:
      - x: 11000
        y: 0
      - x: 11200
        y: 0
