# IEEE-082/IEEE-092 fixture — BASIC-012 Freq/Watt (CSIP V1.2 §8.12).
#
# IEEE-092 added opModFreqWatt to pkg/sep2.DERControlBase. The
# fixture seeds it pointing at DERCurve id "0" (curveType =
# CurveTypeOpModFreqWatt = 1). opModFreqDroop is the §8.5 LFRT/HFRT
# droop coefficient and is not used here.

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "BASIC-012-FSA"
    description: "BASIC-012 single FSA"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1

der_programs:
  - end_device_id: "0"
    fsa_id: "0"
    id: "0"
    mrid: "BASIC-012-DERP"
    description: "BASIC-012 Freq/Watt program"
    primacy: 0
    default_der_control_link: "/edev/0/fsa/0/derp/0/dderc"
    der_control_list_link:
      href: "/edev/0/fsa/0/derp/0/derc"
      all: 1
    der_curve_list_link:
      href: "/dc"
      all: 1

der_controls:
  - end_device_id: "0"
    fsa_id: "0"
    der_program_id: "0"
    id: "0"
    mrid: "BASIC-012-DERC"
    der_control_base:
      op_mod_freq_watt: 0  # → der_curves[0].id

der_curves:
  - id: "0"
    mrid: "BASIC-012-CURVE"
    description: "Frequency/Watt envelope (Figure 12)"
    curve_type: 1  # CurveTypeOpModFreqWatt
    curve_data:
      - x: 5970
        y: 10000
      - x: 6000
        y: 10000
      - x: 6020
        y: 5000
      - x: 6100
        y: 0
