# IEEE-105 — CI workflow scaffold (Plan 2 Phase 7 ticket 1 of 2).
# IEEE-106 — CSIP harness integration + archive-grade logs (ticket 2 of 2).
# IEEE-109 — workflow_dispatch entry point for re-attestation runs.
#
# Standard Go signal: build, vet, lint, test, test-race, coverage (`ci` job).
# CSIP V1.2 harness: build-tag matrix (csip_test_hooks off/on) plus race
# detector on the hooks-on suite. Per-job stdout/stderr is teed to a file
# and uploaded as a workflow artifact with 90-day retention so Phase 9
# IEEE-109 can index the archive-grade evidence.
#
# Re-attestation runs (IEEE-109): `gh workflow run ci.yml --ref <SHA>`.
# `workflow_dispatch` lets us pin a CI run to a specific main SHA for the
# conformance package without pushing a fresh commit. After the run
# completes, `scripts/archive-ci-logs.sh <run-id>` mirrors the artifacts
# into the Knowledge workspace at projects/ieee-2030_5-go/artifacts/
# outputs/ci-archive/.
#
# Runner: ubuntu-latest. This is a documented exception to the
# workspace `runs-on: self-hosted` policy — see .claude/rules/devops.md.
# Rationale: third-party-org repo (GRIDAPPSD), test-only CI (no deploy,
# no secrets, no docker push). Self-hosted is reserved for projects with
# deploy-bearing CI.
# Coverage gate is warn-not-fail at this stage; IEEE-107 (Phase 8) ratchets
# the gate to fail at the achieved threshold.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g. "IEEE-108 re-attestation against SHA xyz")'
        required: false
        default: 'manual'

# Cancel in-flight runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: build / vet / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # IEEE-116 — Plan-4 decision 2: PR-gate runs property tests with a
      # pinned RAPID_SEED for deterministic, reproducible failures.
      # Reproduction: re-run with the same seed to get the same shrunk
      # counterexample. A nightly cron job with time-based seeding (broader
      # exploration) is a separate follow-up (out of IEEE-116 scope).
      # Seed is a non-zero integer; value 1747227600 derived from plan-4
      # approval timestamp 2026-05-14T15:00:00Z.
      RAPID_SEED: 1747227600
    steps:
      - name: Checkout
        # IEEE-124: bumped v4→v6 for Node.js 24 runtime.
        uses: actions/checkout@v6

      - name: Setup Go
        # IEEE-124: bumped v5→v6 for Node.js 24 runtime.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Build
        run: make build-all

      - name: Lint
        # golangci-lint v2.9.0 is the first v2.x release built with go1.26 and
        # carrying the "go1.26 support" change (PR #6271). It matches go.mod's
        # `go 1.26.3` so the analyzer can parse go1.26 packages. Config schema
        # is unchanged (v2). See `.golangci.yml`.
        # The action installs the binary (cached across runs) and runs it.
        # golangci-lint-action@v9 ships Node.js 24 (v9.0.0 release).
        # The `version:` input name is unchanged from v7.
        # IEEE-124: bumped v7→v9 for Node.js 24 runtime.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

      - name: Test
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Test (coverage)
        # Aggregate `./...` coverage profile for the upload artifact.
        # The fail-gate operates on the CSIP-scoped profile in the
        # `csip` job below (IEEE-107) — this step stays informational
        # because the vendored internal/tls/gotls/ fork drags the
        # aggregate well below policy and is not in the conformance
        # scope.
        run: make test-cover

      - name: Upload coverage artifact
        if: always()
        # IEEE-124: bumped v4→v7 for Node.js 24 runtime.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn
          retention-days: 14

  # IEEE-106 — CSIP V1.2 harness with the csip_test_hooks build-tag matrix.
  #
  # Two parallel jobs: tag `off` exercises the production code path, tag
  # `on` exercises the IEEE-024/025 mutation + time-advance hooks. Both
  # must pass for the workflow to be green.
  #
  # The harness covers `./test/csip/...` and `./internal/...` so production
  # paths reached by CSIP tests participate in the captured signal. After
  # the matrix call, the hooks-on job runs the race detector against the
  # CSIP suite — catches subscription-fan-out / aggregator races the unit
  # race pass might not surface.
  #
  # Archive-grade logs: each `go test` invocation tees stdout+stderr to a
  # per-step `.log` file via the Makefile-equivalent inline command, and
  # the per-job artifact ships at 90-day retention (GitHub max). Phase 9
  # IEEE-109 indexes these into the Knowledge repo and mirrors the bulk
  # tarball to the durable store it owns.
  csip:
    name: csip harness (hooks=${{ matrix.hooks }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        hooks: [off, on]
    env:
      # `SEP2_TEST_MUTATION_TOKEN` gates the IEEE-024 mutation surface in
      # hooks-on builds; without it, those endpoints stay disabled and the
      # binary logs a warning. The csip_test_hooks suite tolerates an
      # empty token (mutation-dependent tests skip), but CI exercises the
      # full path by providing a per-run token. Not a secret — the
      # mutation surface only exists in -tags csip_test_hooks builds and
      # only listens on the in-process test server.
      SEP2_TEST_MUTATION_TOKEN: ci-${{ github.run_id }}
    steps:
      - name: Checkout
        # IEEE-124: bumped v4→v6 for Node.js 24 runtime.
        uses: actions/checkout@v6

      - name: Setup Go
        # IEEE-124: bumped v5→v6 for Node.js 24 runtime.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: CSIP harness (default tag)
        if: matrix.hooks == 'off'
        # `set -o pipefail` so `tee` does not mask test failures.
        # The Makefile `test-csip` target wraps `go test ./test/csip/...
        # ./internal/...` under the production build tag.
        shell: bash
        run: |
          set -o pipefail
          make test-csip 2>&1 | tee ci-logs/csip-tag-off.log

      - name: CSIP harness — scripts/test-csip-server.sh wrapper smoke
        if: matrix.hooks == 'off'
        # Validates the CLAUDE.md-referenced `make test-csip-server` entry
        # point keeps working alongside the new make targets. The script
        # wraps `go test -v ./test/csip/...` (production tag) and skips
        # cleanly when SunSpec PKI fixtures are absent.
        shell: bash
        run: |
          set -o pipefail
          make test-csip-server 2>&1 | tee ci-logs/csip-server-script.log

      - name: CSIP harness (csip_test_hooks tag)
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make test-csip-hooks 2>&1 | tee ci-logs/csip-tag-on.log

      - name: CSIP harness — race detector (csip_test_hooks tag)
        if: matrix.hooks == 'on'
        # Race only runs on the hooks-on axis (per Phase 7 doc): the
        # mutation + time-advance hooks are the surface most likely to
        # surface subscription-fan-out / aggregator races.
        shell: bash
        run: |
          set -o pipefail
          make test-csip-race 2>&1 | tee ci-logs/csip-race.log

      - name: CSIP scoped coverage profile (csip_test_hooks tag)
        # IEEE-107 Deliverable 3 — runs the CSIP suite once more under
        # the hooks-on axis with the scoped -coverpkg set so the gate
        # operates on production code reachable from CSIP-mode
        # execution. Achieved 79.1% at IEEE-106 merge; gate floors at
        # 78% (1pp below for measurement noise).
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make test-csip-cover 2>&1 | tee ci-logs/csip-cover.log

      - name: CSIP coverage gate (fail-at-threshold)
        # IEEE-107 — flips the gate from warn-not-fail (IEEE-105) to
        # fail at the achieved threshold. Unit-tested by
        # scripts/coverage_gate_test.go.
        if: matrix.hooks == 'on'
        shell: bash
        run: |
          set -o pipefail
          make coverage-gate 2>&1 | tee ci-logs/csip-coverage-gate.log

      - name: Upload CSIP archive-grade logs
        if: always()
        # 90-day retention = GitHub Actions max. Phase 9 IEEE-109 indexes
        # these artifacts into Knowledge and mirrors the bulk tarball to
        # the long-term durable store it owns.
        # IEEE-124: bumped v4→v7 for Node.js 24 runtime.
        uses: actions/upload-artifact@v7
        with:
          name: csip-logs-${{ matrix.hooks }}-${{ github.sha }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload CSIP scoped coverage profile
        # IEEE-107 — separate artifact so Phase 9 IEEE-109 can pull the
        # scoped profile directly without parsing ci-logs/. Hooks-on
        # axis only (the axis that runs `make test-csip-cover`).
        # IEEE-124: bumped v4→v7 for Node.js 24 runtime.
        if: matrix.hooks == 'on' && always()
        uses: actions/upload-artifact@v7
        with:
          name: csip-coverage-${{ github.sha }}
          path: coverage-csip.out
          if-no-files-found: warn
          retention-days: 90
