# IEEE-066 fixture — one DERProgram with one DERControl that the test
# augments with RandomizeStart/RandomizeDuration. Targets CORE-021
# (Randomized Events, server-side emission) per V1.2 §7.1.
#
# Topology:
#   EndDevice 0 -> FSA 0 -> DERProgram 0 -> DERControl "rnd-1"
#                                          (no DefaultDERControl, no curves)
#
# The DERControl seeded here carries an opModFixedW value so the test
# has a concrete control to walk to. The RandomizeStart and
# RandomizeDuration fields are NOT settable through csiptest's fixture
# loader (loader internals are off-limits per IEEE-058 — fixture schema
# is frozen). The test writes them onto the loaded DERControl directly
# via the public store API before booting the server. The values the
# test sets are documented here for cross-reference:
#
#   randomize_start    = 30   (seconds, signed int32 per V1.2 §7.1)
#   randomize_duration = 60   (seconds)
#
# Both fields use small positive values: large enough to be visibly
# non-zero on the wire, small enough that a sloppy int16/int8
# truncation regression would not silently pass.

end_devices:
  - id: "0"
    sfdi: "273448359951"
    lfdi: "65DE1159BA8C8897D5A7F94997D22544EB90A2B7"
    enabled: true
    changed_time: 1700000000
    registration_link: "/edev/0/rg"
    function_set_assignments_list_link:
      href: "/edev/0/fsa"
      all: 1

fsas:
  - end_device_id: "0"
    id: "0"
    mrid: "CORE-021-FSA"
    description: "CORE-021 single FSA"
    der_program_list_link:
      href: "/edev/0/fsa/0/derp"
      all: 1

der_programs:
  - end_device_id: "0"
    fsa_id: "0"
    id: "0"
    mrid: "CORE-021-DERP"
    description: "CORE-021 single DERProgram"
    primacy: 0
    der_control_list_link:
      href: "/edev/0/fsa/0/derp/0/derc"
      all: 1

der_controls:
  - end_device_id: "0"
    fsa_id: "0"
    der_program_id: "0"
    id: "rnd-1"
    mrid: "CORE-021-DERC-1"
    der_control_base:
      op_mod_fixed_w:
        multiplier: 0
        value: 3000
